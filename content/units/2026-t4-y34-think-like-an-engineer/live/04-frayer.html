<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Word wall · Year 3/4 Tin-foil Boats</title>
<script src="../../../assets/theme.js" data-area="live"></script>
<script src="../../../assets/live.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- Colours and the student styles are shared by every artefact. -->
<link rel="stylesheet" href="../../../assets/tokens.css">
<link rel="stylesheet" href="../../../assets/live.css">
</head>
<body>
<div class="stage frayer" id="stage">
  <header>
    <span class="t">Year 3/4 · Tin-foil Boats</span>
    <span class="u">Word wall: Frayer model</span>
    <button type="button" class="theme" data-theme-toggle>Light mode</button>
    <a href="../lessons/04-tin-foil-boats/">Exit</a>
  </header>

  <div class="body">
    <div class="grid" id="grid"></div>
    <div class="word" id="word" aria-live="polite"></div>
  </div>

  <footer>
    <span class="hint">Word:</span>
    <div id="words" style="display: flex; gap: 10px"></div>
    <button type="button" class="btn spacer" id="showAll">Show all</button>
    <button type="button" class="btn" id="hideAll">Hide all</button>
  </footer>
</div>

<script>
// Colours come from tokens.css; T("violet") gives a token's hex value.
const T = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
// Small pictures, drawn in a 64x64 box.
const foilSq = (x, y, w) => `<rect x="${x}" y="${y}" width="${w}" height="${w}" fill="var(--mist)" stroke="var(--text-violet)" stroke-width="2.5"/>`;
const peb = (x, y, r = 6) => `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--paper)" stroke="var(--text-violet)" stroke-width="2"/>`;
const tray = `<path d="M8 30 H56 L50 48 H14 Z" fill="var(--mist)" stroke="var(--text-violet)" stroke-width="3" stroke-linejoin="round"/>`;
const cross = `<path d="M8 8 L56 56 M56 8 L8 56" stroke="var(--plasma-pink)" stroke-width="5" stroke-linecap="round"/>`;
const P = {
  oneSquare: () => foilSq(12, 12, 40) + `<text x="32" y="38" text-anchor="middle" font-size="16" font-weight="800" fill="var(--void)">1</text>`,
  timer: () => `<circle cx="32" cy="34" r="22" fill="var(--panel-2)" stroke="var(--text-violet)" stroke-width="3"/><rect x="28" y="6" width="8" height="6" fill="var(--text-violet)"/><path d="M32 34 L32 18 A16 16 0 0 1 46 40 Z" fill="var(--solar-orange)"/><text x="32" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">4 min</text>`,
  noTape: () => `<circle cx="32" cy="32" r="16" fill="var(--panel-2)" stroke="var(--solar-orange)" stroke-width="4"/><circle cx="32" cy="32" r="7" fill="var(--paper)"/>` + cross,
  boat: () => tray + `<path d="M8 50 Q20 44 32 50 T56 50" stroke="var(--ion-cyan)" stroke-width="3" fill="none"/>`,
  pebbles: () => peb(20, 46) + peb(34, 46) + peb(48, 46) + peb(27, 34) + peb(41, 34) + peb(34, 22) + `<text x="54" y="18" font-size="12" font-weight="800" fill="var(--ink)" text-anchor="middle">9</text>`,
  idea: () => `<path d="M32 8 C18 8 12 18 12 26 C12 34 20 38 22 46 H42 C44 38 52 34 52 26 C52 18 46 8 32 8 Z" fill="var(--solar-orange)" stroke="var(--text-violet)" stroke-width="2.5"/><rect x="23" y="48" width="18" height="8" rx="2" fill="var(--mist)"/>`,
  samePebbles: () => peb(18, 32, 9) + peb(46, 32, 9) + `<text x="32" y="38" text-anchor="middle" font-size="16" font-weight="800" fill="var(--ink)">=</text>`,
  middle: () => tray + peb(32, 24) + `<path d="M32 4 V14 M27 10 L32 15 L37 10" stroke="var(--solar-orange)" stroke-width="3" fill="none" stroke-linecap="round"/>`,
  sameFoil: () => foilSq(4, 20, 24) + foilSq(36, 20, 24) + `<text x="32" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">=</text>`,
  bigFoil: () => foilSq(4, 30, 18) + foilSq(28, 10, 32),
  drop: () => tray + peb(32, 8) + `<path d="M32 16 V26" stroke="var(--solar-orange)" stroke-width="3" stroke-dasharray="3 3"/>`,
  bigPebble: () => peb(18, 36, 6) + peb(44, 32, 14),
};

// Frayer models for the lesson's key words.
const WORDS = [
  {
    word: "constraint",
    def: "A rule or limit that a design must follow.",
    traits: ["it is set before you start", "every group has the same ones", "your design must fit inside it"],
    yes: [["oneSquare", "only one square of foil"], ["timer", "4 minutes to build"], ["noTape", "no tape"]],
    no: [["boat", "the shape you choose"], ["pebbles", "the score (a result)"], ["idea", "a good idea to try"]],
  },
  {
    word: "fair test",
    def: "A test where only one thing changes and everything else stays the same.",
    traits: ["change one thing only", "keep everything else the same", "test the same way every time"],
    yes: [["samePebbles", "the same pebbles for every boat"], ["middle", "pebbles in the middle each time"], ["sameFoil", "the same size foil for everyone"]],
    no: [["bigFoil", "one group gets more foil"], ["drop", "dropping pebbles from up high"], ["bigPebble", "bigger pebbles for one boat"]],
  },
];

const BOXES = [
  { key: "def", label: "What does it mean?", cls: "top left" },
  { key: "traits", label: "What is it like?", cls: "top right" },
  { key: "yes", label: "Examples", cls: "left" },
  { key: "no", label: "Non-examples", cls: "right no" },
];

const $ = (id) => document.getElementById(id);
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pic = (name, mark) => `<span class="pic"><svg viewBox="0 0 64 64" aria-hidden="true">${P[name]()}</svg><span class="mark">${mark}</span></span>`;

function content(w, key) {
  if (key === "def") return `<p class="def">${esc(w.def)}</p>`;
  if (key === "traits") return `<ul class="traits">${w.traits.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`;
  const mark = key === "yes" ? "✓" : "✗";
  return `<div class="items">${w[key].map(([p, t]) => `<div class="item">${pic(p, mark)}<span>${esc(t)}</span></div>`).join("")}</div>`;
}

let current = 0;

function show(i) {
  current = i;
  const w = WORDS[i];
  $("word").textContent = w.word;
  $("grid").innerHTML = BOXES.map((b, n) => `
    <section class="box ${b.cls}" aria-label="${b.label}">
      <p class="label">${b.label}</p>
      ${content(w, b.key)}
      <button type="button" class="cover" data-box="${n}"><strong>${b.label}</strong><span>Think first, then tap to show</span></button>
    </section>`).join("");
  [...$("words").children].forEach((btn, j) => btn.setAttribute("aria-pressed", String(j === i)));
}

function reveal(n) {
  const cover = document.querySelector(`.cover[data-box="${n}"]`);
  if (cover) cover.hidden = true;
}

WORDS.forEach((w, j) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "btn";
  b.textContent = w.word;
  b.addEventListener("click", () => show(j));
  $("words").appendChild(b);
});
$("grid").addEventListener("click", (e) => {
  const cover = e.target.closest(".cover");
  if (cover) cover.hidden = true;
});
$("showAll").addEventListener("click", () => BOXES.forEach((_, n) => reveal(n)));
$("hideAll").addEventListener("click", () => show(current));
document.addEventListener("keydown", (e) => {
  if (["1", "2", "3", "4"].includes(e.key)) reveal(Number(e.key) - 1);
  if (e.key === "ArrowRight") show((current + 1) % WORDS.length);
  if (e.key === "ArrowLeft") show((current + WORDS.length - 1) % WORDS.length);
});

// Inside the lesson slides, the arrows uncover each box, then move to the next word (live.js).
window.liveSteps = { kind: "words", count: WORDS.length, at: () => current, show };

function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / $("stage").offsetHeight);
  $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();
show(0);
</script>
</body>
</html>
