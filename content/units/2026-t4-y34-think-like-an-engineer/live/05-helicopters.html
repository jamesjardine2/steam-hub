<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>How to build and test a helicopter · Year 3/4 Paper Helicopters</title>
<script src="../../../assets/theme.js" data-area="live"></script>
<script src="../../../assets/live.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- Colours and the student styles are shared by every artefact. -->
<link rel="stylesheet" href="../../../assets/tokens.css">
<link rel="stylesheet" href="../../../assets/live.css">
</head>
<body>
<div class="stage howto" id="stage">
  <header>
    <span class="t">Year 3/4 · Paper Helicopters</span>
    <span class="u">How to build and test a helicopter</span>
    <button type="button" class="theme" data-theme-toggle>Light mode</button>
    <a href="../lessons/05-paper-helicopters/">Exit</a>
  </header>

  <div class="body">
    <svg viewBox="0 0 480 470" id="scene" role="img" aria-labelledby="title"></svg>
    <div class="text" aria-live="polite">
      <span class="num" id="num">1</span>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="words" id="words"></div>
    </div>
  </div>

  <footer>
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <button type="button" id="again">Play again</button>
    <button type="button" class="primary" id="next">Next</button>
  </footer>
</div>

<script>
// Colours come from tokens.css; T("violet") gives a token's hex value.
const T = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");

const INK = T("text-violet"), ORANGE = T("solar-orange");
const seg = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const backdrop = `<rect x="10" y="10" width="460" height="450" rx="22" fill="var(--panel)"/>`;
const label = (x, y, text, size = 26, colour = INK) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${colour}">${text}</text>`;
const stroke = `stroke="${INK}" stroke-width="5" stroke-linejoin="round"`;

// A helicopter seen from the front: wings of length w each side, a stem, optional clips.
function heli(cx, y, w, clips = 0, spin = 0) {
  const lift = 14 * Math.sin(spin);
  let s = `<path d="M${cx - 12} ${y} L${cx - 12 - w} ${y - 8 - lift} L${cx - 12 - w} ${y + 14 - lift} L${cx - 12} ${y + 22} Z" fill="var(--paper)" ${stroke}/>`;
  s += `<path d="M${cx + 12} ${y} L${cx + 12 + w} ${y - 8 + lift} L${cx + 12 + w} ${y + 14 + lift} L${cx + 12} ${y + 22} Z" fill="var(--paper)" ${stroke}/>`;
  s += `<rect x="${cx - 12}" y="${y}" width="24" height="90" fill="var(--paper)" ${stroke}/>`;
  for (let i = 0; i < clips; i++) s += `<rect x="${cx - 14}" y="${y + 80 + i * 14}" width="28" height="22" rx="8" fill="none" stroke="${ORANGE}" stroke-width="6"/>`;
  return s;
}

// One scene per step: each takes progress p (0 to 1) and returns SVG.
const SCENES = [
  // 1. A strip of paper and a pair of scissors.
  (p) => {
    const t = ease(seg(p, 0, 0.4));
    let s = backdrop + `<g transform="translate(240 230) scale(${0.5 + 0.5 * t})"><rect x="-40" y="-150" width="80" height="300" fill="var(--paper)" ${stroke}/></g>`;
    const cut = seg(p, 0.45, 0.9);
    s += `<path d="M240 80 V${80 + 120 * cut}" stroke="${ORANGE}" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round"/>`;
    return s + label(240, 430, "1 paper strip. Cut a slit.", 28);
  },
  // 2. Fold the two wings in opposite directions.
  (p) => {
    const t = ease(seg(p, 0.1, 0.8));
    let s = backdrop + `<rect x="212" y="170" width="56" height="230" fill="var(--paper)" ${stroke}/>`;
    s += `<path d="M212 170 L${212 - 70 * t} ${170 - 20 * t} L${212 - 70 * t} ${200 - 10 * t} L212 210 Z" fill="var(--paper)" ${stroke}/>`;
    s += `<path d="M268 170 L${268 + 70 * t} ${170 + 20 * t} L${268 + 70 * t} ${200 + 30 * t} L268 210 Z" fill="var(--paper)" ${stroke}/>`;
    return s + label(240, 110, t < 1 ? "Fold..." : "Wings go opposite ways!", 28);
  },
  // 3. Pick ONE variable: the second helicopter has shorter wings.
  (p) => {
    const t = ease(seg(p, 0.1, 0.6));
    let s = backdrop + heli(130, 150, 80) + heli(350, 150, 80 - 45 * t);
    s += label(130, 400, "Standard", 26) + label(350, 400, "Shorter wings", 26, ORANGE);
    const show = seg(p, 0.6, 0.8);
    return s + `<g opacity="${show}"><rect x="140" y="50" width="200" height="50" rx="14" fill="var(--panel-2)" stroke="${INK}" stroke-width="3"/>${label(240, 85, "ONE change", 28)}</g>`;
  },
  // 4. Drop both from the same marked height.
  (p) => {
    const t = ease(seg(p, 0.25, 0.9));
    const y = 90 + 200 * t;
    let s = backdrop + `<path d="M30 80 H450" stroke="${ORANGE}" stroke-width="5" stroke-dasharray="12 8"/>`;
    s += heli(130, y, 70, 0, p * 40) + heli(350, y, 35, 0, p * 40);
    return s + label(240, 440, "Same height. Same time.", 28);
  },
  // 5. Time it, three drops: three trials.
  (p) => {
    const rows = [["Trial 1", "2.4 s"], ["Trial 2", "2.5 s"], ["Trial 3", "2.4 s"]];
    let s = backdrop + `<rect x="70" y="80" width="340" height="290" rx="14" fill="var(--paper)" stroke="${INK}" stroke-width="5"/>`;
    rows.forEach(([a, b], i) => {
      const on = seg(p, 0.1 + i * 0.25, 0.3 + i * 0.25);
      s += `<g opacity="${on}"><text x="100" y="${150 + i * 80}" font-size="30" font-weight="700" fill="${T("void")}">${a}</text><text x="380" y="${150 + i * 80}" text-anchor="end" font-size="34" font-weight="800" fill="${T("violet")}">${b}</text><line x1="100" y1="${168 + i * 80}" x2="380" y2="${168 + i * 80}" stroke="${T("line")}" stroke-width="3"/></g>`;
    });
    return s;
  },
  // 6. Compare the times: which change worked best?
  (p) => {
    const a = 60 * ease(seg(p, 0.1, 0.6)), b = 120 * ease(seg(p, 0.1, 0.6));
    let s = backdrop + `<rect x="130" y="${370 - b}" width="90" height="${b}" rx="8" fill="${T("violet")}"/><rect x="260" y="${370 - a}" width="90" height="${a}" rx="8" fill="${ORANGE}"/>`;
    s += label(175, 410, "Standard", 24) + label(305, 410, "Shorter", 24);
    const show = seg(p, 0.7, 0.9);
    return s + `<g opacity="${show}"><rect x="110" y="50" width="260" height="70" rx="14" fill="var(--panel-2)" stroke="${INK}" stroke-width="3"/>${label(240, 96, "Longer fall wins", 28)}</g>`;
  },
];

const STEPS = [
  { title: "Cut a slit in a paper strip.", sub: "Cut down the middle of the top half.", dur: 4500, words: ["1 strip", "slit"] },
  { title: "Fold the wings opposite ways.", sub: "One forward, one back.", dur: 4500, words: ["wings"] },
  { title: "Change ONE thing.", sub: "Make a second helicopter with shorter wings. Keep the rest the same.", dur: 5500, words: [["variable", "yes"], ["control", "yes"]], wordsFrom: 0.5 },
  { title: "Drop both from the same height.", sub: "Stand behind the line.", dur: 5000, words: [], },
  { title: "Time it. Drop it three times.", sub: "Write every time down.", dur: 6000, words: [["trial", "yes"]], wordsFrom: 0.3 },
  { title: "Compare your times.", sub: "Which change worked best? That is your evidence.", dur: 5000, words: ["evidence", "one change"], wordsFrom: 0.7 },
];

const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = 0, start = 0, frame = 0;

function renderWords(step, p) {
  const n = step.words.length;
  $("words").innerHTML = step.words.map((w, i) => {
    const [text, kind] = Array.isArray(w) ? w : [w, ""];
    const at = step.wordsAt ? step.wordsAt[i] : (step.wordsFrom ?? 0.1) + (i / n) * (1 - (step.wordsFrom ?? 0.1)) * 0.8;
    return `<span class="word ${kind}${p >= at ? " done" : ""}">${text}</span>`;
  }).join("");
}

function tick(now) {
  const step = STEPS[current];
  const p = reduceMotion ? 1 : Math.min(1, (now - start) / step.dur);
  $("scene").innerHTML = SCENES[current](p);
  renderWords(step, p);
  if (p < 1) frame = requestAnimationFrame(tick);
}

function go(i) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const step = STEPS[current];
  $("num").textContent = current + 1;
  $("title").textContent = step.title;
  $("sub").textContent = step.sub;
  [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", j === current ? "step" : "false"));
  $("back").disabled = current === 0;
  $("next").disabled = current === STEPS.length - 1;
  cancelAnimationFrame(frame);
  start = performance.now();
  frame = requestAnimationFrame(tick);
}

STEPS.forEach((_, j) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dot";
  b.textContent = j + 1;
  b.setAttribute("aria-label", `Step ${j + 1}`);
  b.addEventListener("click", () => go(j));
  $("dots").appendChild(b);
});
$("back").addEventListener("click", () => go(current - 1));
$("next").addEventListener("click", () => go(current + 1));
$("again").addEventListener("click", () => go(current));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") go(current - 1);
});

// Inside the lesson slides, the arrows go through these steps first (live.js).
window.liveSteps = { kind: "steps", count: STEPS.length, at: () => current, go };

function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / $("stage").offsetHeight);
  $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();
go(0);
</script>
</body>
</html>
