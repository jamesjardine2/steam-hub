<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>How to Make a Cardboard Prototype · Year 5/6 Control Panel</title>
<script src="../../../assets/theme.js" data-area="live"></script>
<script src="../../../assets/live.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- Colours and the student styles are shared by every artefact. -->
<link rel="stylesheet" href="../../../assets/tokens.css">
<link rel="stylesheet" href="../../../assets/live.css">
<style>
/* The video (Quirky, "How to make a cardboard prototype", 2 min) plays
   from a file on the classroom computer, because YouTube is blocked at
   school. The file is never copied into this public site: the teacher
   picks it once and this browser keeps it (IndexedDB) for next time. */
.video-page .body { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 24px; }
.video-page .frame { width: 100%; max-width: 1180px; aspect-ratio: 16 / 9; max-height: 100%; border-radius: var(--radius-card); overflow: hidden; background: var(--void); }
.video-page video { width: 100%; height: 100%; display: block; }
.video-page .pick { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.video-page .pick p { margin: 0; font-size: 20px; color: var(--text-muted); }
.video-page [hidden] { display: none; }
</style>
</head>
<body>
<div class="stage video-page" id="stage">
  <header>
    <span class="t">Year 5/6 · How to Make a Cardboard Prototype</span>
    <span class="u">Control Panel · Lesson 6</span>
    <a href="../lessons/06-build-test-and-improve/">Exit</a>
  </header>
  <div class="body">
    <div class="frame" id="frame" hidden>
      <video id="video" controls playsinline preload="metadata"></video>
    </div>
    <div class="pick" id="pick" hidden>
      <button type="button" class="primary" id="choose">Choose the video file</button>
      <p>How to make a cardboard prototype (.mp4). This computer remembers it.</p>
      <input type="file" id="file" accept="video/*" hidden>
    </div>
  </div>
</div>
<script>
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
const stage = document.getElementById("stage");
function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / stage.offsetHeight);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();

// Keep the chosen file in this browser only, so it plays without YouTube.
const KEY = "06-cardboard-prototype";
function db() {
  return new Promise((ok, fail) => {
    const req = indexedDB.open("steamhub-videos", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("videos");
    req.onsuccess = () => ok(req.result);
    req.onerror = () => fail(req.error);
  });
}
async function load() {
  try {
    const d = await db();
    return await new Promise((ok) => {
      const req = d.transaction("videos").objectStore("videos").get(KEY);
      req.onsuccess = () => ok(req.result || null);
      req.onerror = () => ok(null);
    });
  } catch { return null; }
}
async function save(file) {
  try {
    const d = await db();
    d.transaction("videos", "readwrite").objectStore("videos").put(file, KEY);
  } catch { /* still plays this time, just not remembered */ }
}
function play(blob) {
  document.getElementById("video").src = URL.createObjectURL(blob);
  document.getElementById("frame").hidden = false;
  document.getElementById("pick").hidden = true;
}
document.getElementById("choose").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  save(file);
  play(file);
});
load().then((blob) => blob ? play(blob) : (document.getElementById("pick").hidden = false));
</script>
</body>
</html>
