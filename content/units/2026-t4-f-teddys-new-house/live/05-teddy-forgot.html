<!-- Lesson 5 hook (CIC): a truck tips a pile of bricks, Teddy races back
     and forth building his house in a rush without a plan, then walks into
     the wall: there is no door. He runs round to look for one, knocks, and
     shrugs. Same Teddy and engine as the Lesson 4 storm (04-storm.html), but
     a different story so it does not feel like a repeat. Click or press
     the spacebar to start or pause, R restarts, M mutes. It ends on Teddy
     with a question mark, so it can stay on the screen while you ask the
     hook question. -->
<title>Teddy Forgot Something</title>

<script>
const $ = id => document.getElementById(id);
const DUR = 26.5;

/* ---------- build bits of scenery ---------- */
function cloud(scale){
  const c=[[0,0,26],[30,-14,32],[62,0,26],[32,8,26]];
  let s='';
  c.forEach(([x,y,r])=>s+=`<circle cx="${x*scale}" cy="${y*scale}" r="${r*scale}" fill="#2b1a0e" stroke="#2b1a0e" stroke-width="8"/>`);
  c.forEach(([x,y,r])=>s+=`<circle cx="${x*scale}" cy="${y*scale}" r="${r*scale}" fill="#fff"/>`);
  s+=`<ellipse cx="${18*scale}" cy="${-16*scale}" rx="${14*scale}" ry="${8*scale}" fill="#F3FBFF"/>`;
  return s;
}
$('cloud1').innerHTML=cloud(1);
$('cloud2').innerHTML=cloud(.75);
function storm(sc){
  const c=[[0,0,40],[45,-26,50],[100,-10,44],[140,8,36],[60,14,40],[-30,12,30]];
  let s='';
  c.forEach(([x,y,r])=>s+=`<circle cx="${x*sc}" cy="${y*sc}" r="${r*sc}" fill="#2b1a0e" stroke="#2b1a0e" stroke-width="8"/>`);
  c.forEach(([x,y,r])=>s+=`<circle cx="${x*sc}" cy="${y*sc}" r="${r*sc}" fill="#78909C"/>`);
  s+=`<ellipse cx="${40*sc}" cy="${-34*sc}" rx="${30*sc}" ry="${12*sc}" fill="#90A4AE"/>`;
  s+=`<ellipse cx="${60*sc}" cy="${26*sc}" rx="${70*sc}" ry="${10*sc}" fill="#607D8B"/>`;
  return s;
}
$('storm1').innerHTML=storm(1.3); $('storm2').innerHTML=storm(1.2); $('storm3').innerHTML=storm(1.1);

let rays='';
for(let i=0;i<12;i++){rays+=`<polygon points="-7,-44 7,-44 0,-62" fill="#FFB300" class="ol" stroke-width="3" transform="rotate(${i*30})"/>`;}
$('sunRays').innerHTML=rays;

let rl='';
for(let j=1;j<=4;j++){const h=j*20, hw=138*(1-h/104); rl+=`M${-hw+4} ${-h} H${hw-4} `;}
$('roofLines').setAttribute('d',rl);

let rowsSVG='';
for(let i=0;i<6;i++){
  const bricks = i%2===0 ? [[-110,44],[-66,44],[-22,44],[22,44],[66,44]] : [[-110,22],[-88,44],[-44,44],[0,44],[44,44],[88,22]];
  rowsSVG+=`<g id="row${i}">`;
  bricks.forEach(([bx,w],k)=>{
    const c=['#C0392B','#B83227','#CD4433'][(i+k)%3];
    rowsSVG+=`<rect x="${bx}" y="-20" width="${w}" height="20" fill="${c}" stroke="#5B1A10" stroke-width="2.5"/>`;
    rowsSVG+=`<rect x="${bx+4}" y="-16" width="${w-10}" height="4" rx="2" fill="#E8806F" opacity=".65"/>`;
  });
  rowsSVG+=`<rect x="-110" y="-20" width="220" height="20" fill="none" class="ol"/></g>`;
}
$('rows').innerHTML=rowsSVG;

let pileSVG='';
[[4,0],[3,1],[2,2],[1,3]].forEach(([n,r])=>{
  for(let k=0;k<n;k++){
    const bx=-n*12+k*24, c=['#C0392B','#B83227','#CD4433'][(k+r)%3];
    pileSVG+=`<rect x="${bx}" y="${-13-r*13}" width="24" height="13" fill="${c}" stroke="#5B1A10" stroke-width="2.5"/>`;
  }
});
$('pile').innerHTML=pileSVG;

/* ---------- tween engine ---------- */
const E={
  lin:u=>u,
  io:u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,
  out:u=>1-Math.pow(1-u,3),
  in:u=>u*u,
  step:u=>0,
  back:u=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2)},
  elastic:u=>u===0?0:u===1?1:Math.pow(2,-10*u)*Math.sin((u*10-.75)*(2*Math.PI)/3)+1
};
const S={}, tracks={}, events=[];
function obj(id,base){S[id]={el:$(id),s:Object.assign({x:0,y:0,rot:0,sx:1,sy:1,op:1},base)};}
function K(id,prop,t,v,e){(tracks[id+'|'+prop] ||= []).push([t,v,e]);}
function at(t,fn){events.push({t,fn,fired:false});}
function val(keys,t){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=1;i<keys.length;i++){
    const k=keys[i];
    if(t<k[0]){const p=keys[i-1];const u=(t-p[0])/(k[0]-p[0]);return p[1]+(k[1]-p[1])*E[k[2]||'io'](u);}
  }
  return keys[keys.length-1][1];
}

/* ---------- sound (made on the fly, no files) ---------- */
let AC=null, muted=false, noiseBuf=null;
function initAudio(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
      const len=AC.sampleRate*.5; noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;}
    AC.resume();
  }catch(e){AC=null;}
}
function tone(type,f0,f1,dur,vol,delay=0){
  if(!AC||muted) return;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(dur,vol,freq){
  if(!AC||muted) return;
  const t=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=noiseBuf; f.type='lowpass'; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t+dur+.05);
}
const sfx={
  bang(){noise(.12,.5,3000);tone('square',260,70,.1,.18);},
  clunk(){noise(.15,.4,900);tone('sine',180,60,.15,.4);},
  thud(){noise(.35,.7,500);tone('sine',110,35,.4,.7);},
  pop(){tone('sine',420,1300,.12,.3);},
  boing(){tone('triangle',180,520,.18,.25);tone('triangle',520,260,.2,.2,.18);},
  whoosh(){noise(.35,.25,1500);},
  thunder(){noise(1.8,.55,170);tone('sine',70,35,1.4,.35);noise(.6,.25,400);},
  tada(){[523,659,784,1047].forEach((f,i)=>tone('square',f,f*1.001,.28,.1,i*.11));}
};

let rainSrc=null, rainGain=null;
function rainOn(){
  if(!AC||rainSrc) return;
  rainSrc=AC.createBufferSource(); rainSrc.buffer=noiseBuf; rainSrc.loop=true;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; f.Q.value=.5;
  rainGain=AC.createGain(); rainGain.gain.setValueAtTime(0,AC.currentTime);
  rainGain.gain.linearRampToValueAtTime(muted?0:.3,AC.currentTime+1.5);
  rainSrc.connect(f).connect(rainGain).connect(AC.destination); rainSrc.start();
}
function rainOff(){ if(rainSrc){try{rainSrc.stop();}catch(e){} rainSrc=null;} }

/* ---------- effects (bangs, dust, sparkles, confetti) ---------- */
let fx=[], shakeT=-9;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function star(R,r,n){let p=[];for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,rr=i%2?r:R;p.push((Math.cos(a)*rr).toFixed(1)+','+(Math.sin(a)*rr).toFixed(1));}return p.join(' ');}
const STAR10=star(48,26,10), STAR5=star(9,4,5);
function fxSVG(f,t){
  const a=t-f.t0; if(a<0) return '';
  if(f.type==='word'){
    if(a>.65) return '';
    const sc=a<.1?a/.1*1.25:Math.max(1,1.25-(a-.1)*2.5), op=a<.45?1:1-(a-.45)/.2;
    return `<g transform="translate(${f.x},${f.y}) rotate(${f.rot}) scale(${sc*f.size})" opacity="${op}"><polygon points="${STAR10}" fill="${f.col}" class="ol"/><polygon points="${STAR10}" fill="#fff" opacity=".7" transform="scale(.45)"/></g>`;
  }
  if(f.type==='dust'){
    if(a>.8) return '';
    let s='', op=1-a/.8, u=E.out(a/.8);
    for(let i=0;i<6;i++){const dir=i<3?-1:1, k=i%3;
      s+=`<circle cx="${f.x+dir*(18+k*26)*u*f.spread}" cy="${f.y-8-a*(14+k*10)}" r="${(9+k*4+a*12)*f.size}" fill="#E8DCC8" stroke="#2b1a0e" stroke-width="3" opacity="${op}"/>`;}
    return s;
  }
  if(f.type==='spark'){
    if(a>.7) return '';
    let s='', op=1-a/.7;
    for(let i=0;i<8;i++){const ang=i*Math.PI/4+.3, d=12+E.out(a/.7)*58;
      s+=`<polygon points="${STAR5}" transform="translate(${f.x+Math.cos(ang)*d},${f.y+Math.sin(ang)*d}) rotate(${a*400}) scale(1.4)" fill="#FFF176" stroke="#2b1a0e" stroke-width="1.5" opacity="${op}"/>`;}
    return s;
  }
  if(f.type==='dizzy'){
    if(a>2.4) return '';
    const op=a>2?1-(a-2)/.4:1;
    let s='';
    for(let i=0;i<3;i++){const ang=a*5+i*2.09;
      s+=`<polygon points="${STAR5}" transform="translate(${f.x+Math.cos(ang)*38},${f.y+Math.sin(ang)*9}) scale(1.6)" fill="#FFF176" stroke="#2b1a0e" stroke-width="1.5" opacity="${op}"/>`;}
    return s;
  }
  if(f.type==='confetti'){
    if(a>3.4) return '';
    const cols=['#FF5252','#FFEB3B','#40C4FF','#69F0AE','#E040FB','#FF9100'];
    let s='';
    for(let i=0;i<46;i++){
      const x=rnd(i)*800+Math.sin(a*3+i)*18, y=-20+a*(110+rnd(i+50)*120)+a*a*20;
      if(y>470) continue;
      s+=`<rect x="-5" y="-3" width="10" height="6" fill="${cols[i%6]}" transform="translate(${x},${y}) rotate(${a*(200+rnd(i+9)*300)}) scale(1,${Math.cos(a*8+i).toFixed(2)})"/>`;
    }
    return s;
  }
  return '';
}

/* ---------- scene objects ---------- */
['slab','chimney','door','winL','winR','roof','sun','storm1','storm2','storm3','row0','row1','row2','row3','row4','row5','qmark','truck','pile','bedLoad'].forEach(id=>obj(id));

function drop(id,t,x,y,dur){
  K(id,'x',0,x); K(id,'y',0,y-560); K(id,'y',t,y-560,'step'); K(id,'y',t+dur,y,'in');
  K(id,'sx',0,1); K(id,'sy',0,1); K(id,'sx',t+dur*.6,.9); K(id,'sy',t+dur*.6,1.12);
  K(id,'sx',t+dur,1.12,'out'); K(id,'sy',t+dur,.8,'out');
  K(id,'sx',t+dur+.45,1,'elastic'); K(id,'sy',t+dur+.45,1,'elastic');
}
function pop(id,t){
  K(id,'sx',0,0); K(id,'sy',0,0); K(id,'sx',t,0,'step'); K(id,'sy',t,0,'step');

  at(t,tt=>{sfx.pop(); const s=S[id].s; fx.push({type:'spark',t0:tt,x:s.x,y:s.y-(id==='door'?32:0)});});
}

/* ---------- rendering ---------- */
function apply(id){
  const o=S[id], s=o.s;
  o.el.setAttribute('transform',`translate(${s.x},${s.y}) rotate(${s.rot}) scale(${s.sx},${s.sy})`);
  o.el.setAttribute('opacity',s.op);
}
const tEls={L:$('tLegL'),R:$('tLegR'),U:$('tUpper'),AL:$('tArmL'),AR:$('tArmR'),H:$('tHead'),E:$('tEyes'),T:$('teddy'),Sh:$('tShadow')};

function render(t){
  for(const key in tracks){const [id,prop]=key.split('|'); S[id].s[prop]=val(tracks[key],t);}
  for(const id in S){ if(S[id].el) apply(id); }

  if(t>=25.1) S.qmark.el.setAttribute('transform',`translate(${S.qmark.s.x},${S.qmark.s.y+Math.sin(rc*3)*5}) scale(${S.qmark.s.sx},${S.qmark.s.sy})`);

  // teddy puppet
  const s=S.ted.s, w=s.walk, ph=t*11, sw=Math.sin(ph);
  tEls.L.setAttribute('transform',`translate(-14,-34) rotate(${sw*28*w})`);
  tEls.R.setAttribute('transform',`translate(14,-34) rotate(${-sw*28*w})`);
  tEls.U.setAttribute('transform',`translate(0,${-Math.abs(Math.cos(ph))*6*w})`);
  tEls.AL.setAttribute('transform',`translate(-30,-84) rotate(${s.armL+sw*25*w})`);
  tEls.AR.setAttribute('transform',`translate(30,-84) rotate(${s.armR-sw*25*w})`);
  tEls.H.setAttribute('transform',`translate(0,-100) rotate(${s.tilt+Math.sin(t*2.2)*3})`);
  const blink=(t%3.3)<.13?.12:1;
  tEls.E.setAttribute('transform',`translate(0,-36) scale(1,${blink})`);
  tEls.T.setAttribute('transform',`translate(${s.x+Math.sin(rc*70)*1.6*s.shiver},${360+s.y}) scale(${.8*s.sx*s.face},${.8*s.sy})`);
  const lift=Math.min(1,-s.y/80);
  $('tMouth').style.display=s.sad>.5?'none':''; $('tMouthSad').style.display=s.sad>.5?'':'none';
  tEls.Sh.setAttribute('transform',`translate(${s.x},361) scale(${1-lift*.5},1)`);

  // speed lines behind Teddy while he rushes
  let sl='';
  if(s.zoom>.5){
    for(let k=0;k<3;k++){
      const x0=s.x-s.face*(38+k*10), y0=360-38-k*36, len=34+((t*40+k*13)%18);
      sl+=`<line x1="${x0}" y1="${y0}" x2="${x0-s.face*len}" y2="${y0}"/>`;
    }
  }
  $('speed').innerHTML=`<g stroke="#2b1a0e" stroke-width="4" stroke-linecap="round" opacity=".55">${sl}</g>`;

  // truck: wheels roll with the truck, the bed tips from its back hinge
  $('wh1').setAttribute('transform',`translate(-48,-12) rotate(${S.truck.s.x*57.3/15})`);
  $('wh2').setAttribute('transform',`translate(48,-12) rotate(${S.truck.s.x*57.3/15})`);
  $('bed').setAttribute('transform',`rotate(${S.truck.s.tip||0},70,-18)`);

  // sky
  $('sunRays').setAttribute('transform',`rotate(${t*25})`);
  $('cloud1').setAttribute('transform',`translate(${(180+t*14)%960-90},70)`);
  $('cloud2').setAttribute('transform',`translate(${(640+t*9)%960-90},120)`);

  // storm, rain, splashes, puddles
  const W=S.wx.s;
  $('dark').setAttribute('opacity',W.dark);
  const cOp=1-Math.min(1,W.dark/.3)*.85;
  $('cloud1').setAttribute('opacity',cOp); $('cloud2').setAttribute('opacity',cOp);
  let rn='', sp='';
  if(W.rain>0){
    const n=Math.floor(130*W.rain);
    for(let i=0;i<n;i++){
      const spd=520+rnd(i)*260, y=((rc*spd+rnd(i+3)*520)%520)-40, x=rnd(i+7)*920-40-y*.2;
      rn+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x-4).toFixed(1)}" y2="${(y+20).toFixed(1)}"/>`;
    }
    for(let i=0;i<34;i++){
      const per=.45+rnd(i+20)*.4, ph=((rc+rnd(i+40)*per)%per)/per;
      let x,y;
      if(i<12){ x=345+rnd(i+60)*250; y=224-104*(1-Math.abs(x-470)/138)-2; }
      else { x=rnd(i+80)*800; y=368+rnd(i+90)*75; }
      sp+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(2+ph*11).toFixed(1)}" ry="${(1+ph*3.5).toFixed(1)}" opacity="${((1-ph)*W.rain).toFixed(2)}"/>`;
    }
  }
  $('rain').innerHTML=`<g stroke="#E3F2FD" stroke-width="2.5" stroke-linecap="round" opacity=".85">${rn}</g>`;
  $('splash').innerHTML=`<g fill="none" stroke="#fff" stroke-width="2.5">${sp}</g>`;
  let pd='';
  if(W.puddle>0){
    [[110,392,46],[650,400,56],[330,425,40],[540,438,34]].forEach(([x,y,r])=>{
      const rr=r*W.puddle;
      pd+=`<ellipse cx="${x}" cy="${y}" rx="${rr}" ry="${rr*.22}" fill="#64B5F6" stroke="#2b1a0e" stroke-width="3"/><ellipse cx="${x-rr*.3}" cy="${y-rr*.05}" rx="${rr*.3}" ry="${rr*.05}" fill="#BBDEFB"/>`;
    });
  }
  $('puddles').innerHTML=pd;

  // chimney smoke
  let sm='';
  if(t>15.2){
    const st=t-15.2;
    for(let i=0;i<4;i++){
      const p=((st*.45)+i/4)%1; if(st*.45<i/4) continue;
      const x=552+Math.sin(p*6+i)*9+p*30, y=128-p*95, r=7+p*16;
      sm+=`<g opacity="${(1-p).toFixed(2)}"><circle cx="${x}" cy="${y}" r="${r}" fill="#ECEFF1" stroke="#2b1a0e" stroke-width="3"/><circle cx="${x-r*.3}" cy="${y-r*.3}" r="${r*.35}" fill="#fff"/></g>`;
    }
  }
  $('smoke').innerHTML=sm;

  // effects
  let f='';
  fx=fx.filter(e=>t-e.t0<3.6 && t>=e.t0);
  fx.forEach(e=>f+=fxSVG(e,t));
  $('fx').innerHTML=f;

  // screen shake
  const sa=t-shakeT;
  const k=sa>=0&&sa<.28?(1-sa/.28)*6:0;
  $('world').setAttribute('transform',`translate(${(Math.random()-.5)*k},${(Math.random()-.5)*k})`);


}

/* ---------- player: click anywhere to start or pause, R restarts, M mutes ---------- */
let t=0, rc=0, playing=false, last=null, started=false;
function fire(t0,t1){for(const ev of events){if(!ev.fired&&ev.t<=t1){ev.fired=true;ev.fn(ev.t);}}}
function restart(){t=0; rc=0; fx=[]; shakeT=-9; events.forEach(ev=>ev.fired=false); rainOff();}
function setPlaying(p){playing=p; if(AC){p?AC.resume():AC.suspend();}}
function toggle(){
  initAudio();
  if(!started||t>=DUR){ restart(); started=true; setPlaying(true); return; }
  setPlaying(!playing);
}
function frame(now){
  if(last===null) last=now;
  const dt=Math.min(.25,(now-last)/1000); last=now;   // keeps real time even if frames are slow
  if(playing){
    const nt=Math.min(DUR,t+dt); fire(t,nt); t=nt; rc+=dt;
    if(t>=DUR) playing=false;          // timeline done, the question mark keeps bobbing
  } else if(t>=DUR){ rc+=dt; }
  render(t);
  requestAnimationFrame(frame);
}
$('stage').addEventListener('click',toggle);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.key==='r'||e.key==='R'){initAudio(); restart(); started=true; setPlaying(true);}
  // Inside the lesson deck, arrows and Page keys still move the slides.
  if(parent!==window&&['ArrowRight','ArrowLeft','PageDown','PageUp'].includes(e.key)){parent.document.dispatchEvent(new KeyboardEvent('keydown',{key:e.key}));}
  if(e.key==='m'||e.key==='M'){muted=!muted; if(rainGain) rainGain.gain.value=muted?0:.3;}
});
render(0);
requestAnimationFrame(frame);
</script>
