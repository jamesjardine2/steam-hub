<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>How to plan a house · Foundation A house for Teddy</title>
<script src="../../../assets/theme.js" data-area="live"></script>
<script src="../../../assets/live.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- Colours and the student styles are shared by every artefact. -->
<link rel="stylesheet" href="../../../assets/tokens.css">
<link rel="stylesheet" href="../../../assets/live.css">
<!-- Pictures shared by every artefact in this unit. -->
<script src="pictures.js"></script>
</head>
<body>
<div class="stage howto" id="stage">
  <header>
    <span class="t">Foundation · A house for Teddy</span>
    <span class="u">How to plan a house</span>
    <button type="button" class="theme" data-theme-toggle>Light mode</button>
    <a href="../lessons/05-a-house-for-teddy/">Exit</a>
  </header>

  <div class="body">
    <svg viewBox="0 0 480 470" id="scene" role="img" aria-labelledby="title"></svg>
    <div class="text" aria-live="polite">
      <span class="num" id="num">1</span>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="words" id="words"></div>
    </div>
  </div>

  <footer>
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <button type="button" id="again">Play again</button>
    <button type="button" class="primary" id="next">Next</button>
  </footer>
</div>

<script>
// Colours come from tokens.css; T("violet") gives a token's hex value.
const T = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");

const seg = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const backdrop = `<rect x="10" y="10" width="460" height="450" rx="22" fill="var(--panel)"/><rect x="40" y="30" width="400" height="410" fill="var(--paper)" stroke="var(--border)" stroke-width="3"/>`;
const O = 'stroke="var(--ink)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
const tag = (x, y, text, k) => k <= 0 ? "" : `<g opacity="${k}"><rect x="${x - 52}" y="${y - 20}" width="104" height="36" rx="8" fill="var(--paper)" ${O}/><text x="${x}" y="${y + 7}" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)">${text}</text></g>`;

// The plan grows from step to step. Each part is drawn when its step starts.
const walls = (k) => `<rect x="110" y="${400 - 180 * k}" width="260" height="${180 * k}" fill="none" ${O}/>`;
const roof = (k) => k <= 0 ? "" : `<path d="M90 220 L240 ${220 - 110 * k} L390 220 Z" fill="var(--solar-orange)" opacity="${0.4 + 0.6 * k}" ${O}/>`;
const door = (k) => k <= 0 ? "" : `<rect x="215" y="300" width="50" height="100" fill="var(--violet)" ${O}/>` +
  (k > 0.5 ? `<path d="M215 300 L180 312 L180 408 L215 400" fill="none" ${O} stroke-dasharray="8 8"/><path d="M232 280 Q 200 270 190 292" fill="none" stroke="var(--solar-orange)" stroke-width="5" stroke-linecap="round"/><path d="M190 292 l2 -14 m-2 14 l14 -4" stroke="var(--solar-orange)" stroke-width="5" stroke-linecap="round"/>` : "");
const win = (k) => k <= 0 ? "" : `<rect x="140" y="250" width="50" height="50" fill="var(--ion-cyan)" opacity="${k}" ${O}/><rect x="290" y="250" width="50" height="50" fill="var(--ion-cyan)" opacity="${k}" ${O}/>`;

const SCENES = [
  // 1. Walls
  (p) => backdrop + walls(ease(seg(p, 0.1, 0.8))),
  // 2. Roof
  (p) => backdrop + walls(1) + roof(ease(seg(p, 0.1, 0.8))),
  // 3. A door that opens
  (p) => backdrop + walls(1) + roof(1) + door(ease(seg(p, 0.1, 0.5)) * (p > 0.5 ? 1 : 0.5)),
  // 4. Windows
  (p) => backdrop + walls(1) + roof(1) + door(1) + win(ease(seg(p, 0.1, 0.7))),
  // 5. Labels
  (p) => backdrop + walls(1) + roof(1) + door(1) + win(1) +
    `<path d="M240 130 L240 80" ${O}/>` + tag(240, 66, "roof", ease(seg(p, 0.05, 0.3))) +
    `<path d="M240 350 L240 430" ${O} opacity="${ease(seg(p, 0.3, 0.5))}"/>` + tag(240, 420, "door", ease(seg(p, 0.3, 0.55))) +
    `<path d="M165 275 L90 330" ${O} opacity="${ease(seg(p, 0.55, 0.75))}"/>` + tag(90, 346, "window", ease(seg(p, 0.55, 0.8))),
  // 6. Tell a partner: Teddy likes the plan
  (p) => {
    const k = ease(seg(p, 0.1, 0.8));
    return backdrop + `<g transform="translate(60 40) scale(0.7)">` + walls(1) + roof(1) + door(1) + win(1) + `</g><g transform="translate(${300 + (1 - k) * 100} 270) scale(1.4)" opacity="${k}">${PIC.teddyHappy()}</g>`;
  },
];

const STEPS = [
  { title: "Draw the walls.", sub: "Use a pencil.", dur: 4000, words: [] },
  { title: "Draw the roof.", sub: "It will be plastic, to keep Teddy dry.", dur: 4000, words: [["roof", "yes"]], wordsFrom: 0.5 },
  { title: "Draw a door that opens.", sub: "Show which way it swings.", dur: 6000, words: [["hinge", "yes"]], wordsFrom: 0.6 },
  { title: "Draw the windows.", sub: "Teddy needs light.", dur: 4000, words: [] },
  { title: "Label each part.", sub: "Write the word.", dur: 7000, words: [["label", "yes"]], wordsFrom: 0.1 },
  { title: "Tell a partner.", sub: "Say what each part is for.", dur: 5000, words: [["plan", "yes"]], wordsFrom: 0.5 },
];

const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = 0, start = 0, frame = 0;

function renderWords(step, p) {
  const n = step.words.length;
  $("words").innerHTML = step.words.map((w, i) => {
    const [text, kind] = Array.isArray(w) ? w : [w, ""];
    const at = step.wordsAt ? step.wordsAt[i] : (step.wordsFrom ?? 0.1) + (i / n) * (1 - (step.wordsFrom ?? 0.1)) * 0.8;
    return `<span class="word ${kind}${p >= at ? " done" : ""}">${text}</span>`;
  }).join("");
}

function tick(now) {
  const step = STEPS[current];
  const p = reduceMotion ? 1 : Math.min(1, (now - start) / step.dur);
  $("scene").innerHTML = SCENES[current](p);
  renderWords(step, p);
  if (p < 1) frame = requestAnimationFrame(tick);
}

function go(i) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const step = STEPS[current];
  $("num").textContent = current + 1;
  $("title").textContent = step.title;
  $("sub").textContent = step.sub;
  [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", j === current ? "step" : "false"));
  $("back").disabled = current === 0;
  $("next").disabled = current === STEPS.length - 1;
  cancelAnimationFrame(frame);
  start = performance.now();
  frame = requestAnimationFrame(tick);
}

STEPS.forEach((_, j) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dot";
  b.textContent = j + 1;
  b.setAttribute("aria-label", `Step ${j + 1}`);
  b.addEventListener("click", () => go(j));
  $("dots").appendChild(b);
});
$("back").addEventListener("click", () => go(current - 1));
$("next").addEventListener("click", () => go(current + 1));
$("again").addEventListener("click", () => go(current));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") go(current - 1);
});

// Inside the lesson slides, the arrows go through these steps first (live.js).
window.liveSteps = { kind: "steps", count: STEPS.length, at: () => current, go };

function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / $("stage").offsetHeight);
  $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();
go(0);
</script>
</body>
</html>
