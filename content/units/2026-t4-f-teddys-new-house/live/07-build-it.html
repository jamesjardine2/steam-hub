<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>How to build Teddy's house · Foundation Build Teddy's House</title>
<script src="../../../assets/theme.js" data-area="live"></script>
<script src="../../../assets/live.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- Colours and the student styles are shared by every artefact. -->
<link rel="stylesheet" href="../../../assets/tokens.css">
<link rel="stylesheet" href="../../../assets/live.css">
<!-- Pictures shared by every artefact in this unit. -->
<script src="pictures.js"></script>
</head>
<body>
<div class="stage howto" id="stage">
  <header>
    <span class="t">Foundation · Build Teddy's House</span>
    <span class="u">How to build Teddy's house</span>
    <button type="button" class="theme" data-theme-toggle>Light mode</button>
    <a href="../lessons/07-build-teddys-house/">Exit</a>
  </header>

  <div class="body">
    <svg viewBox="0 0 480 470" id="scene" role="img" aria-labelledby="title"></svg>
    <div class="text" aria-live="polite">
      <span class="num" id="num">1</span>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="words" id="words"></div>
    </div>
  </div>

  <footer>
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <button type="button" id="again">Play again</button>
    <button type="button" class="primary" id="next">Next</button>
  </footer>
</div>

<script>
// Colours come from tokens.css; T("violet") gives a token's hex value.
const T = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");

const seg = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const backdrop = `<rect x="10" y="10" width="460" height="450" rx="22" fill="var(--panel)"/>`;
const O = 'stroke="var(--ink)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
const label = (x, y, text, k = 1, size = 28) => k <= 0 ? "" : `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="800" fill="var(--ink)" opacity="${k}">${text}</text>`;
// LEGO bricks front on: one brick is 52 wide (2 studs) and 30 high.
const BW = 52, BH = 30, GROUND = 390, WALL = "var(--plasma-pink)";
function brick(x, y, w, colour = WALL) {
  let s = `<rect x="${x}" y="${y}" width="${w * BW}" height="${BH}" rx="3" fill="${colour}" ${O}/>`;
  for (let i = 0; i < Math.round(w * 2); i++) s += `<rect x="${x + i * BW / 2 + 7}" y="${y - 7}" width="${BW / 2 - 14}" height="7" fill="${colour}" ${O}/>`;
  return s;
}
const plate = (k = 1) => k <= 0 ? "" : `<rect x="60" y="${GROUND}" width="360" height="18" rx="3" fill="var(--volt-blue)" opacity="${k}" ${O}/>`;
const rowY = (r) => GROUND - (r + 1) * BH;
const drop = (svg, k) => k <= 0 ? "" : `<g transform="translate(0 ${-(1 - k) * 160})" opacity="${Math.min(1, k * 2)}">${svg}</g>`;
// Teddy's house: walls 5 bricks wide with overlapping rows, a doorway in
// the middle of the bottom two rows, a card door and a clear plastic roof.
const L = 110;
function row(r) {
  if (r % 2 === 0) return [0, 1, 2, 3, 4].map((i) => brick(L + i * BW, rowY(r), 1)).join("");
  return brick(L, rowY(r), 0.5) + [0, 1, 2, 3].map((i) => brick(L + BW / 2 + i * BW, rowY(r), 1)).join("") + brick(L + 4.5 * BW, rowY(r), 0.5);
}
const doorway = `<rect x="214" y="${rowY(1)}" width="52" height="${2 * BH}" fill="var(--panel)" stroke="var(--ink)" stroke-width="4"/>`;
const cardDoor = (open = 0) => `<g transform="translate(216 0) scale(${Math.cos(open * 1.2)} 1) translate(-216 0)"><rect x="216" y="${rowY(1) + 3}" width="48" height="${2 * BH - 3}" fill="var(--paper)" ${O}/><circle cx="256" cy="${GROUND - 30}" r="3" fill="var(--ink)"/></g>`;
const tape = (k = 1) => k <= 0 ? "" : `<rect x="206" y="${rowY(1) + 8}" width="16" height="${2 * BH - 16}" fill="var(--mist)" opacity="${0.9 * k}" ${O}/>`;
const ROOFY = rowY(3);
function roof(fold = 1, lift = 0) {
  const side = Math.hypot(150, 110);
  const half = side * (1 - fold) + 150 * fold, apex = ROOFY - 110 * fold - lift;
  return `<path d="M${240 - half} ${ROOFY - lift} L240 ${apex} L${240 + half} ${ROOFY - lift} Z" fill="var(--ion-cyan)" fill-opacity="0.45" ${O}/>`;
}
const windowGap = `<rect x="302" y="${rowY(2)}" width="48" height="${BH}" fill="var(--ion-cyan)" stroke="var(--ink)" stroke-width="4"/>`;
const walls = (rows) => [0, 1, 2, 3].slice(0, rows).map(row).join("") + (rows >= 2 ? doorway : "") + (rows >= 3 ? windowGap : "");

const SCENES = [
  // 1. Start with the base.
  (p) => backdrop + plate(ease(seg(p, 0, 0.5))),
  // 2. Walls: overlap the bricks and leave a doorway.
  (p) => backdrop + plate() + walls(Math.min(2, Math.floor(seg(p, 0, 0.7) * 2.99))),
  // 3. Bricks across the top of the doorway, then the last row, leaving a window.
  (p) => backdrop + plate() + walls(2) + drop(row(2) + windowGap, ease(seg(p, 0, 0.45))) + drop(row(3), ease(seg(p, 0.45, 0.9))),
  // 4. The card door, taped down one side.
  (p) => backdrop + plate() + walls(4) + `<g opacity="${ease(seg(p, 0, 0.3))}">${cardDoor()}</g>` + tape(ease(seg(p, 0.4, 0.7))),
  // 5. Fold the plastic in half.
  (p) => backdrop + plate() + walls(4) + cardDoor() + tape() + `<g transform="translate(0 -60)">${roof(ease(seg(p, 0.1, 0.8)))}</g>`,
  // 6. Sit the roof on the walls and tape each end.
  (p) => backdrop + plate() + walls(4) + cardDoor() + tape() + `<g transform="translate(0 ${-60 * (1 - ease(seg(p, 0, 0.5)))})">${roof()}</g>` + [96, 360].map((x) => `<rect x="${x}" y="${ROOFY - 14}" width="24" height="24" fill="var(--mist)" opacity="${0.92 * ease(seg(p, 0.6, 0.9))}" ${O}/>`).join(""),
  // 7. Check it matches the plan.
  (p) => {
    let s = backdrop + `<g transform="translate(30 130) scale(1.5)">${PIC.planHouse()}</g>`;
    s += `<g transform="translate(232 120) scale(0.5)">${plate() + walls(4) + cardDoor() + tape() + roof()}</g>`;
    ["wall", "door", "window", "roof"].forEach((w, i) => {
      const k = ease(seg(p, 0.15 + i * 0.2, 0.3 + i * 0.2));
      s += `<g opacity="${k}"><path d="M${70 + i * 100} 400 l14 14 l26 -30" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>${label(95 + i * 100, 450, w, 1, 24)}</g>`;
    });
    return s;
  },
];

const STEPS = [
  { title: "Start with the base.", sub: "", dur: 3000, words: [["base", "yes"]], wordsFrom: 0.4 },
  { title: "Build the walls.", sub: "Overlap the bricks. Leave a doorway.", dur: 4500, words: [["overlap", "yes"]], wordsFrom: 0.5 },
  { title: "Bricks across the top.", sub: "Leave a gap for a window.", dur: 4500, words: [] },
  { title: "Tape the door on one side.", sub: "Your door from last week.", dur: 4500, words: [["hinge", "yes"]], wordsFrom: 0.5 },
  { title: "Fold the plastic in half.", sub: "Like a tent.", dur: 4000, words: [["material", "yes"]], wordsFrom: 0.6 },
  { title: "Put the roof on.", sub: "Tape each end.", dur: 4500, words: [] },
  { title: "Check your plan.", sub: "Does it match?", dur: 5500, words: [["structure", "yes"]], wordsFrom: 0.8 },
];

const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = 0, start = 0, frame = 0;

function renderWords(step, p) {
  const n = step.words.length;
  $("words").innerHTML = step.words.map((w, i) => {
    const [text, kind] = Array.isArray(w) ? w : [w, ""];
    const at = step.wordsAt ? step.wordsAt[i] : (step.wordsFrom ?? 0.1) + (i / n) * (1 - (step.wordsFrom ?? 0.1)) * 0.8;
    return `<span class="word ${kind}${p >= at ? " done" : ""}">${text}</span>`;
  }).join("");
}

function tick(now) {
  const step = STEPS[current];
  const p = reduceMotion ? 1 : Math.min(1, (now - start) / step.dur);
  $("scene").innerHTML = SCENES[current](p);
  renderWords(step, p);
  if (p < 1) frame = requestAnimationFrame(tick);
}

function go(i) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const step = STEPS[current];
  $("num").textContent = current + 1;
  $("title").textContent = step.title;
  $("sub").textContent = step.sub;
  [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", j === current ? "step" : "false"));
  $("back").disabled = current === 0;
  $("next").disabled = current === STEPS.length - 1;
  cancelAnimationFrame(frame);
  start = performance.now();
  frame = requestAnimationFrame(tick);
}

STEPS.forEach((_, j) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dot";
  b.textContent = j + 1;
  b.setAttribute("aria-label", `Step ${j + 1}`);
  b.addEventListener("click", () => go(j));
  $("dots").appendChild(b);
});
$("back").addEventListener("click", () => go(current - 1));
$("next").addEventListener("click", () => go(current + 1));
$("again").addEventListener("click", () => go(current));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") go(current - 1);
});

// Inside the lesson slides, the arrows go through these steps first (live.js).
window.liveSteps = { kind: "steps", count: STEPS.length, at: () => current, go };

function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / $("stage").offsetHeight);
  $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();
go(0);
</script>
</body>
</html>
