<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>How to weave · Year 1/2 Weave It</title>
<style>
:root {
  --indigo: #3F51B5;
  --deep: #1A237E;
  --chip: #283593;
  --pale: #E8EAF6;
  --line: #9FA8DA;
  --amber: #F9A825;
  --amber-bg: #FFF8E1;
  --amber-text: #6D4C00;
  --red: #C62828;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #1A1A1A; font-family: Helvetica, Arial, sans-serif; overflow: hidden; }

/* Designed at 1280x720 and scaled to fit the screen or projector. */
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform: translate(-50%, -50%); background: #FFFFFF; color: #222222; display: flex; flex-direction: column; }
header { height: 64px; flex: 0 0 auto; background: var(--indigo); color: #FFFFFF; display: flex; align-items: center; gap: 20px; padding: 0 28px; }
header .t { font-weight: 700; font-size: 18px; }
header .u { margin-left: auto; font-size: 15px; color: var(--pale); }
header a { color: #FFFFFF; font-weight: 700; font-size: 15px; padding: 12px 8px; }

.body { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; gap: 32px; padding: 12px 56px 12px 24px; }
svg { flex: 0 0 600px; height: 100%; }
.text { flex: 1 1 auto; display: flex; flex-direction: column; gap: 22px; }
.num { width: 88px; height: 88px; border-radius: 50%; background: var(--pale); color: var(--indigo); font-weight: 700; font-size: 52px; display: flex; align-items: center; justify-content: center; }
h1 { margin: 0; font-size: 54px; line-height: 1.15; color: var(--deep); }
.sub { margin: 0; font-size: 32px; line-height: 1.3; color: #333333; }
.words { display: flex; flex-wrap: wrap; gap: 10px; min-height: 58px; }
.word { font-size: 28px; font-weight: 700; padding: 10px 16px; border-radius: 10px; background: #F1F1F1; color: #AAAAAA; }
.word.done.over { background: var(--amber-bg); color: var(--amber-text); }
.word.done.under { background: var(--pale); color: var(--chip); }
.word.now { outline: 4px solid var(--amber); }
.check { margin: 0; font-size: 34px; font-weight: 700; color: var(--amber-text); background: var(--amber-bg); border-radius: 14px; padding: 18px 22px; }
.check[hidden] { display: none; }

footer { height: 80px; flex: 0 0 auto; border-top: 1px solid #E0E0E0; display: flex; align-items: center; gap: 12px; padding: 0 28px; }
button { font-family: inherit; font-size: 16px; font-weight: 700; padding: 12px 20px; border-radius: 8px; cursor: pointer; min-height: 48px; background: #FFFFFF; color: var(--indigo); border: 1px solid var(--line); }
button.primary { background: var(--indigo); color: #FFFFFF; border-color: var(--indigo); }
button:disabled { opacity: 0.4; cursor: default; }
.dots { display: flex; gap: 8px; margin: 0 auto; }
.dot { width: 48px; padding: 0; }
.dot[aria-current="step"] { background: var(--indigo); color: #FFFFFF; border-color: var(--indigo); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header>
    <span class="t">Year 1/2 · Weave It</span>
    <span class="u">How to make a paper loom and weave</span>
    <a href="../lessons/03-weave-it/">Exit</a>
  </header>

  <div class="body">
    <svg viewBox="90 60 480 470" role="img" aria-labelledby="title">
      <!-- Bottom half of the sheet, with its half of each slit -->
      <g>
        <rect id="bottomRect" x="150" y="292" width="300" height="212" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="2"/>
        <g id="bottomCuts" stroke="#283593" stroke-width="3" stroke-linecap="round"></g>
      </g>
      <!-- Top half: flips down to fold and back up to open -->
      <g id="top">
        <rect id="topRect" x="150" y="80" width="300" height="212" stroke="#9FA8DA" stroke-width="2"/>
        <g id="topCuts" stroke="#283593" stroke-width="3" stroke-linecap="round"></g>
      </g>
      <line id="crease" x1="150" y1="292" x2="450" y2="292" stroke="#C5CAE9" stroke-width="2" stroke-dasharray="6 6"/>

      <!-- Weaving -->
      <g id="strips"></g>
      <g id="patches"></g>
      <g id="slits" stroke="#283593" stroke-width="3" stroke-linecap="round"></g>
      <rect id="outline" x="150" y="80" width="300" height="424" fill="none" stroke="#9FA8DA" stroke-width="2"/>

      <!-- Labels for cutting -->
      <text id="foldLabel" x="300" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#3F51B5">Fold: cut from here</text>
      <g id="stop">
        <line x1="150" y1="480" x2="450" y2="480" stroke="#C62828" stroke-width="3" stroke-dasharray="8 6"/>
        <text x="462" y="472" font-size="18" font-weight="700" fill="#C62828">Stop!</text>
        <path d="M462 480 H472 M467 480 V504 M462 504 H472" stroke="#C62828" stroke-width="2" fill="none"/>
        <text x="478" y="498" font-size="15" fill="#C62828">finger-width</text>
      </g>
      <g id="scissors">
        <circle cx="-9" cy="-36" r="8" fill="none" stroke="#3F51B5" stroke-width="4"/>
        <circle cx="9" cy="-36" r="8" fill="none" stroke="#3F51B5" stroke-width="4"/>
        <line id="bladeL" x1="-6" y1="-28" x2="2" y2="0" stroke="#555555" stroke-width="4" stroke-linecap="round"/>
        <line id="bladeR" x1="6" y1="-28" x2="-2" y2="0" stroke="#555555" stroke-width="4" stroke-linecap="round"/>
      </g>
    </svg>

    <div class="text" aria-live="polite">
      <span class="num" id="num">1</span>
      <h1 id="title">Fold your paper in half.</h1>
      <p class="sub" id="sub"></p>
      <div class="words" id="words"></div>
      <p class="check" id="check" hidden>Check: does it look like a checkerboard?</p>
    </div>
  </div>

  <footer>
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <button type="button" id="again">Play again</button>
    <button type="button" class="primary" id="next">Next</button>
  </footer>
</div>

<script>
// Loom geometry (SVG units). The sheet is folded short edge to short edge
// at y = 292, so slits are cut from the fold and stop a finger-width
// (24 units) short of the open edge.
const LEFT = 150, WIDTH = 300, FOLD = 292, CUT = 188, BANDS = 6, BAND = WIDTH / BANDS;
const ROW_TOP = 108, ROW_H = 68, ROW_GAP = 4, ROWS = 5;
const STRIP_X = 120, STRIP_L = 360;
const COLOURS = ["#F9A825", "#3F51B5"];
const NS = "http://www.w3.org/2000/svg";

const seg = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const isOver = (row, band) => (band + row) % 2 === 0;
const none = [0, 0, 0, 0, 0];

const STEPS = [
  { title: "Fold your paper in half.", sub: "Short edge to short edge. Press the fold flat.", dur: 2600,
    state: (p) => ({ fold: 1 - 2 * ease(seg(p, 0.15, 0.85)), cuts: 0, strips: none }) },
  { title: "Cut 5 slits from the fold.", sub: "Stop a finger-width from the edge!", dur: 6000,
    state: (p) => ({ fold: -1, cuts: 5 * seg(p, 0.05, 0.95), stop: true, strips: none }) },
  { title: "Open it out.", sub: "This is your loom. The edge holds it together.", dur: 2600,
    state: (p) => ({ fold: -1 + 2 * ease(seg(p, 0.15, 0.85)), cuts: 5, strips: none }) },
  { title: "Strip 1: over, under.", sub: "Push the strip over, under, over, under.", row: 0, dur: 7000,
    state: (p) => ({ fold: 1, cuts: 5, weave: true, strips: [seg(p, 0.05, 0.95), 0, 0, 0, 0] }) },
  { title: "Strip 2: under, over.", sub: "Do the opposite! Slide it up close.", row: 1, dur: 7000,
    state: (p) => ({ fold: 1, cuts: 5, weave: true, strips: [1, seg(p, 0.05, 0.95), 0, 0, 0] }) },
  { title: "Keep going!", sub: "Swap each time. 4 or 5 strips fill the loom.", dur: 7500, check: true,
    state: (p) => ({ fold: 1, cuts: 5, weave: true, strips: [1, 1, seg(p, 0, 0.32), seg(p, 0.34, 0.65), seg(p, 0.67, 0.98)] }) },
];

const $ = (id) => document.getElementById(id);
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};

// Build the cut lines, strips and the paper patches that hide a strip
// wherever it goes under.
const topCuts = [], bottomCuts = [], strips = [], patches = [];
for (let k = 1; k < BANDS; k++) {
  const x = LEFT + k * BAND;
  topCuts.push(el("line", { x1: x, x2: x, y1: FOLD, y2: FOLD }, $("topCuts")));
  bottomCuts.push(el("line", { x1: x, x2: x, y1: FOLD, y2: FOLD }, $("bottomCuts")));
  el("line", { x1: x, x2: x, y1: FOLD - CUT, y2: FOLD + CUT }, $("slits"));
}
for (let r = 0; r < ROWS; r++) {
  const y = ROW_TOP + r * (ROW_H + ROW_GAP);
  strips.push(el("rect", { y, height: ROW_H, width: STRIP_L, rx: 3, fill: COLOURS[r % 2] }, $("strips")));
  const g = el("g", {}, $("patches"));
  for (let b = 0; b < BANDS; b++) {
    if (!isOver(r, b)) el("rect", { x: LEFT + b * BAND, y, width: BAND, height: ROW_H, fill: "#FFFFFF" }, g);
  }
  patches.push(g);
}

function show(node, on) { node.style.display = on ? "" : "none"; }

function render(s, time) {
  // Fold: the top half is mirrored about the fold line.
  $("top").setAttribute("transform", `translate(0 ${FOLD}) scale(1 ${s.fold}) translate(0 ${-FOLD})`);
  $("topRect").setAttribute("fill", s.fold >= 0 ? "#FFFFFF" : "#EEF0FA");
  // Once weaving starts the loom is drawn as one sheet with a single outline.
  const edge = s.weave ? "none" : "#9FA8DA";
  $("topRect").setAttribute("stroke", edge);
  $("bottomRect").setAttribute("stroke", edge);
  show($("crease"), s.cuts >= 5 && s.fold > -0.99 && !s.weave);

  topCuts.forEach((line, k) => {
    const len = Math.min(1, Math.max(0, s.cuts - k)) * CUT;
    line.setAttribute("y2", FOLD - len);
    bottomCuts[k].setAttribute("y2", FOLD + len);
    // A zero-length line with round caps still draws a dot.
    show(line, len > 0);
    show(bottomCuts[k], len > 0);
  });
  show($("foldLabel"), Boolean(s.stop));
  show($("stop"), Boolean(s.stop));

  const cutting = s.stop && s.cuts < 5;
  show($("scissors"), cutting);
  if (cutting) {
    const k = Math.floor(s.cuts);
    const tipY = FOLD + (s.cuts - k) * CUT;
    $("scissors").setAttribute("transform", `translate(${LEFT + (k + 1) * BAND} ${tipY})`);
    const snip = Math.sin(time / 90) * 8;
    $("bladeL").setAttribute("transform", `rotate(${snip} 0 -28)`);
    $("bladeR").setAttribute("transform", `rotate(${-snip} 0 -28)`);
  }

  show($("slits"), Boolean(s.weave));
  show($("outline"), Boolean(s.weave));
  strips.forEach((strip, r) => {
    const p = s.strips[r];
    show(strip, p > 0);
    show(patches[r], p > 0);
    strip.setAttribute("x", STRIP_X - STRIP_L * (1 - p));
  });
}

// "over, under" words that light up as the strip passes each part of the loom.
function renderWords(step, s) {
  const box = $("words");
  if (step.row === undefined) { box.innerHTML = ""; return; }
  const lead = STRIP_X + STRIP_L * s.strips[step.row];
  let html = "";
  for (let b = 0; b < BANDS; b++) {
    const word = isOver(step.row, b) ? "over" : "under";
    const passed = lead >= LEFT + b * BAND + BAND / 2;
    const current = passed && (b === BANDS - 1 || lead < LEFT + (b + 1) * BAND + BAND / 2);
    html += `<span class="word ${word}${passed ? " done" : ""}${current ? " now" : ""}">${word}</span>`;
  }
  box.innerHTML = html;
}

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = 0, start = 0, frame = 0;

function tick(now) {
  const step = STEPS[current];
  const p = reduceMotion ? 1 : Math.min(1, (now - start) / step.dur);
  const s = step.state(p);
  render(s, now);
  renderWords(step, s);
  $("check").hidden = !(step.check && p >= 1);
  if (p < 1) frame = requestAnimationFrame(tick);
}

function go(i) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const step = STEPS[current];
  $("num").textContent = current + 1;
  $("title").textContent = step.title;
  $("sub").textContent = step.sub;
  [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", j === current ? "step" : "false"));
  $("back").disabled = current === 0;
  $("next").disabled = current === STEPS.length - 1;
  cancelAnimationFrame(frame);
  start = performance.now();
  frame = requestAnimationFrame(tick);
}

STEPS.forEach((_, j) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dot";
  b.textContent = j + 1;
  b.setAttribute("aria-label", `Step ${j + 1}`);
  b.addEventListener("click", () => go(j));
  $("dots").appendChild(b);
});
$("back").addEventListener("click", () => go(current - 1));
$("next").addEventListener("click", () => go(current + 1));
$("again").addEventListener("click", () => go(current));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") go(current - 1);
});

function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / 720);
  $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();
go(0);
</script>
</body>
</html>
