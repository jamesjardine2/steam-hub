<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>How to make paste · Year 1/2 Mix It</title>
<script src="../../../assets/theme.js" data-area="live"></script>
<script src="../../../assets/live.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- Colours and the student styles are shared by every artefact. -->
<link rel="stylesheet" href="../../../assets/tokens.css">
<link rel="stylesheet" href="../../../assets/live.css">
</head>
<body>
<div class="stage howto" id="stage">
  <header>
    <span class="t">Year 1/2 · Mix It</span>
    <span class="u">How to make paste and test it</span>
    <button type="button" class="theme" data-theme-toggle>Light mode</button>
    <a href="../lessons/04-mix-it/">Exit</a>
  </header>

  <div class="body">
    <svg viewBox="0 0 480 470" id="scene" role="img" aria-labelledby="title"></svg>
    <div class="text" aria-live="polite">
      <span class="num" id="num">1</span>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="words" id="words"></div>
    </div>
  </div>

  <footer>
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <button type="button" id="again">Play again</button>
    <button type="button" class="primary" id="next">Next</button>
  </footer>
</div>

<script>
// Colours come from tokens.css; T("violet") gives a token's hex value.
const T = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");

const FLOUR = T("paper"), WATER = T("ion-cyan"), PASTE = T("mist"), INK = T("text-violet");
const seg = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const mixHex = (a, b, t) => {
  const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
  return "#" + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, "0")).join("");
};

// Drawing helpers. Cups are drawn side on, slightly narrower at the base.
function cupEdge(x, y, w, h, yy) { const inset = w * 0.1 * ((yy - y) / h); return [x + inset, x + w - inset]; }
function fill(x, y, w, h, from, to, colour, stroke = "none") {
  if (to <= from) return "";
  const top = y + h - to * h, bot = y + h - from * h;
  const [l1, r1] = cupEdge(x, y, w, h, top), [l2, r2] = cupEdge(x, y, w, h, bot);
  return `<path d="M${l1} ${top} L${r1} ${top} L${r2} ${bot} L${l2} ${bot} Z" fill="${colour}" stroke="${stroke}"/>`;
}
function cup(x, y, w, h) {
  const i = w * 0.1;
  return `<path d="M${x} ${y} L${x + w} ${y} L${x + w - i} ${y + h} L${x + i} ${y + h} Z" fill="none" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
}
function spoon(x, y, angle, scoop = "") {
  return `<g transform="translate(${x} ${y}) rotate(${angle})">
    <line x1="0" y1="0" x2="0" y2="-120" stroke="var(--mist)" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="0" cy="14" rx="20" ry="26" fill="var(--mist)"/>${scoop}</g>`;
}
const backdrop = `<rect x="10" y="10" width="460" height="450" rx="22" fill="var(--panel)"/>`;
const label = (x, y, text, size = 26, colour = INK) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${colour}">${text}</text>`;

// One scene per step: each takes progress p (0 to 1) and returns SVG.
const SCENES = [
  // 1. Flour is powdery: a spoon scoops and sprinkles flour back into the cup.
  (p) => {
    const c = (p * 2) % 1;
    const dip = c < 0.3 ? ease(c / 0.3) : c < 0.6 ? 1 - ease((c - 0.3) / 0.3) : 0;
    const tilt = c > 0.6 ? 55 * Math.sin(Math.PI * seg(c, 0.6, 1)) : 0;
    const full = c > 0.3 && c < 0.75;
    let s = backdrop + fill(140, 250, 200, 170, 0, 0.6, FLOUR, T("border"));
    for (let i = 0; i < 26; i++) s += `<circle cx="${170 + (i * 37) % 140}" cy="${330 + (i * 23) % 80}" r="2.5" fill="var(--border)"/>`;
    s += cup(140, 250, 200, 170);
    for (let i = 0; i < 16; i++) {
      const f = seg(c, 0.66 + i * 0.012, 0.86 + i * 0.008);
      if (f > 0 && f < 1) s += `<circle cx="${236 + ((i * 13) % 30) - 12 + f * ((i % 5) - 2) * 6}" cy="${190 + f * 140}" r="4" fill="var(--paper)" stroke="var(--mist)"/>`;
    }
    s += spoon(240, 160 + dip * 130, tilt, full ? `<ellipse cx="0" cy="4" rx="18" ry="12" fill="var(--paper)" stroke="var(--mist)"/>` : "");
    return s + label(240, 450, "flour");
  },
  // 2. Water is runny: a jug pours into a cup.
  (p) => {
    const a = 58 * ease(seg(p, 0, 0.2));
    const level = 0.62 * seg(p, 0.22, 0.9);
    const jx = 150, jy = 140, rad = (a * Math.PI) / 180;
    const sx = jx + 64 * Math.cos(rad) + 70 * Math.sin(rad), sy = jy + 64 * Math.sin(rad) - 70 * Math.cos(rad);
    const surface = 250 + 170 - level * 170;
    let s = backdrop + fill(250, 250, 180, 170, 0, level, WATER) + cup(250, 250, 180, 170);
    if (p > 0.2 && p < 0.92) s += `<path d="M${sx} ${sy} Q${sx + 14} ${sy + 20} ${sx + 14} ${surface}" fill="none" stroke="${WATER}" stroke-width="12" stroke-linecap="round"/>`;
    s += `<g transform="translate(${jx} ${jy}) rotate(${a})">
      <path d="M-60 -70 L64 -70 L56 70 L-52 70 Z" fill="var(--panel-2)" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-56 0 L60 0 L56 70 L-52 70 Z" fill="${WATER}" opacity="${1 - seg(p, 0.2, 0.9) * 0.7}"/>
      <path d="M-60 -40 C-100 -40 -100 30 -56 30" fill="none" stroke="${INK}" stroke-width="6"/></g>`;
    return s + label(340, 450, "water");
  },
  // 3. Mix: 2 spoons of flour, 2 spoons of water, then stir 20 times.
  (p) => {
    const flour = 0.15 * ease(seg(p, 0.02, 0.12)) + 0.15 * ease(seg(p, 0.14, 0.24));
    const water = 0.12 * ease(seg(p, 0.27, 0.37)) + 0.12 * ease(seg(p, 0.39, 0.49));
    const t = seg(p, 0.52, 0.96);
    const x = 140, y = 170, w = 200, h = 230;
    let s = backdrop;
    s += fill(x, y, w, h, 0, flour, mixHex(FLOUR, PASTE, t), T("border"));
    s += fill(x, y, w, h, flour, flour + water, mixHex(WATER, PASTE, t));
    s += cup(x, y, w, h);
    let caption = "";
    if (p < 0.26) {
      const n = p < 0.13 ? 1 : 2;
      s += spoon(250, 130, 40 * Math.sin(Math.PI * seg(p % 0.12, 0, 0.12)), `<ellipse cx="0" cy="4" rx="18" ry="12" fill="var(--paper)" stroke="var(--mist)"/>`);
      caption = `Flour: ${n} ${n === 1 ? "spoon" : "spoons"}`;
    } else if (p < 0.51) {
      const n = p < 0.38 ? 1 : 2;
      s += spoon(250, 130, 40 * Math.sin(Math.PI * seg((p - 0.27) % 0.12, 0, 0.12)), `<ellipse cx="0" cy="6" rx="16" ry="10" fill="${WATER}"/>`);
      caption = `Water: ${n} ${n === 1 ? "spoon" : "spoons"}`;
    } else {
      const turn = t * 20;
      s += spoon(240 + 55 * Math.sin(turn * 2 * Math.PI), 345, 10 * Math.cos(turn * 2 * Math.PI));
      caption = t < 1 ? `Stir: ${Math.min(20, Math.floor(turn) + 1)}` : "Paste!";
    }
    return s + label(240, 60, caption, 32);
  },
  // 4. Stick test: flour falls off, water slides off, paste stays.
  (p) => {
    const shake = Math.sin(p * 60) * 9 * seg(p, 0.08, 0.15) * (1 - seg(p, 0.78, 0.84));
    const lift = -30 * ease(seg(p, 0, 0.1));
    const flourDrop = ease(seg(p, 0.25, 0.48));
    const waterSlide = 18 * ease(seg(p, 0.45, 0.6)), waterDrop = ease(seg(p, 0.62, 0.8));
    const g = (cx, dy, fade, colour, name, glue) =>
      `<g opacity="${1 - fade}" transform="translate(${shake} ${lift + dy})">
        <rect x="${cx - 40}" y="200" width="80" height="80" fill="var(--paper)" stroke="var(--mist)" stroke-width="2"/>
        <rect x="${cx - 40}" y="200" width="80" height="6" fill="${glue}"/>
        ${label(cx, 250, name, 20, colour)}</g>`;
    let s = backdrop;
    s += g(130, flourDrop * 260, flourDrop, INK, "flour", T("mist"));
    s += g(240, waterSlide + waterDrop * 240, waterDrop, INK, "water", WATER);
    s += g(350, 0, 0, INK, "paste", PASTE);
    s += `<g transform="translate(${shake} ${lift})">
      <rect x="60" y="160" width="360" height="40" fill="var(--paper)" stroke="var(--mist)" stroke-width="2"/>
      <circle cx="58" cy="180" r="18" fill="var(--solar-orange)"/><circle cx="422" cy="180" r="18" fill="var(--solar-orange)"/></g>`;
    const show = seg(p, 0.84, 0.9);
    s += `<g opacity="${show}">${label(130, 420, "✗", 54, T("text-pink"))}${label(240, 420, "✗", 54, T("text-pink"))}${label(350, 420, "✓", 54, INK)}</g>`;
    return s;
  },
  // 5. Layer it: strip, paste, strip, paste, strip on the tray.
  (p) => {
    const x = 70, w = 340, H = 26, P = 7, tray = 390;
    const strip = (i) => tray - (i + 1) * H - i * P;
    let s = backdrop + `<rect x="50" y="${tray}" width="380" height="22" rx="5" fill="var(--mist)"/>`;
    const drops = [[0, 0.14], [0.36, 0.5], [0.72, 0.86]];
    const pastes = [[0.17, 0.33], [0.53, 0.69]];
    let layers = 0;
    drops.forEach(([a, b], i) => {
      const t = seg(p, a, b);
      if (t <= 0) return;
      if (t >= 1) layers = i + 1;
      const y = strip(i) - (1 - ease(t)) * 300;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${H}" fill="${i % 2 ? T("violet") : T("solar-orange")}" opacity="0.9"/>`;
    });
    pastes.forEach(([a, b], i) => {
      const t = seg(p, a, b);
      if (t <= 0) return;
      const y = strip(i) - P;
      s += `<rect x="${x}" y="${y}" width="${w * t}" height="${P}" fill="${PASTE}" stroke="var(--ink)"/>`;
      if (t < 1) s += spoon(x + w * t, y - 26, 70);
    });
    return s + label(240, 80, layers ? `${layers} ${layers === 1 ? "layer" : "layers"}` : "", 34);
  },
  // 6. Leave it to dry: the sun crosses the sky and the paste goes dull.
  (p) => {
    const x = 70, w = 340, H = 26, P = 7, tray = 390;
    const t = ease(seg(p, 0.05, 0.9));
    let s = backdrop + `<path d="M70 250 Q240 30 410 250" fill="none" stroke="var(--solar-orange)" stroke-width="3" stroke-dasharray="8 8"/>`;
    // Same curve as the dotted path above.
    const sx = 70 + 340 * t, sy = 250 - 440 * t * (1 - t);
    s += `<circle cx="${sx}" cy="${sy}" r="26" fill="var(--solar-orange)"/>`;
    s += `<rect x="50" y="${tray}" width="380" height="22" rx="5" fill="var(--mist)"/>`;
    for (let i = 0; i < 3; i++) {
      const y = tray - (i + 1) * H - i * P;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${H}" fill="${i % 2 ? T("violet") : T("solar-orange")}" opacity="0.9"/>`;
      if (i < 2) s += `<rect x="${x}" y="${y - P}" width="${w}" height="${P}" fill="${mixHex(PASTE, T("paper"), t)}"/>`;
    }
    s += `<rect x="${x + 20}" y="${tray - 3 * H - 2 * P + 5}" width="${w - 40}" height="5" rx="2" fill="var(--paper)" opacity="${0.7 * (1 - t)}"/>`;
    return s + label(240, 440, t < 1 ? "Drying..." : "Dry!", 30);
  },
];

const STEPS = [
  { title: "Flour is powdery.", sub: "Feel a pinch: it is dry and soft.", dur: 5000, words: ["powdery", "dry", "soft", "white"] },
  { title: "Water is runny.", sub: "It is wet and it flows.", dur: 4000, words: ["runny", "wet", "it flows"] },
  { title: "Mix 2 spoons of flour and 2 spoons of water.", sub: "Stir 20 times. What is it like now?", dur: 9000, words: ["thick", "gooey", "sticky"], wordsFrom: 0.9 },
  { title: "Test: which one sticks?", sub: "Stick on 3 squares. Lift and shake.", dur: 6000, words: [["flour: fell off", "no"], ["water: slid off", "no"], ["paste: stuck!", "yes"]], wordsFrom: 0.86 },
  { title: "Layer it.", sub: "Strip, paste, strip, paste, strip.", dur: 7000, words: ["layer 1", "layer 2", "layer 3"], wordsAt: [0.14, 0.5, 0.86] },
  { title: "Leave it on the tray to dry.", sub: "Wash your hands! Next week: is it stronger?", dur: 5000, words: [] },
];

const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = 0, start = 0, frame = 0;

function renderWords(step, p) {
  const n = step.words.length;
  $("words").innerHTML = step.words.map((w, i) => {
    const [text, kind] = Array.isArray(w) ? w : [w, ""];
    const at = step.wordsAt ? step.wordsAt[i] : (step.wordsFrom ?? 0.1) + (i / n) * (1 - (step.wordsFrom ?? 0.1)) * 0.8;
    return `<span class="word ${kind}${p >= at ? " done" : ""}">${text}</span>`;
  }).join("");
}

function tick(now) {
  const step = STEPS[current];
  const p = reduceMotion ? 1 : Math.min(1, (now - start) / step.dur);
  $("scene").innerHTML = SCENES[current](p);
  renderWords(step, p);
  if (p < 1) frame = requestAnimationFrame(tick);
}

function go(i) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const step = STEPS[current];
  $("num").textContent = current + 1;
  $("title").textContent = step.title;
  $("sub").textContent = step.sub;
  [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", j === current ? "step" : "false"));
  $("back").disabled = current === 0;
  $("next").disabled = current === STEPS.length - 1;
  cancelAnimationFrame(frame);
  start = performance.now();
  frame = requestAnimationFrame(tick);
}

STEPS.forEach((_, j) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dot";
  b.textContent = j + 1;
  b.setAttribute("aria-label", `Step ${j + 1}`);
  b.addEventListener("click", () => go(j));
  $("dots").appendChild(b);
});
$("back").addEventListener("click", () => go(current - 1));
$("next").addEventListener("click", () => go(current + 1));
$("again").addEventListener("click", () => go(current));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") go(current - 1);
});

function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / $("stage").offsetHeight);
  $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();
go(0);
</script>
</body>
</html>
