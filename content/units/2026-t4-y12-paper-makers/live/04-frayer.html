<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Word wall · Year 1/2 Mix It</title>
<script src="../../../assets/theme.js" data-area="live"></script>
<script src="../../../assets/live.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- Colours and the student styles are shared by every artefact. -->
<link rel="stylesheet" href="../../../assets/tokens.css">
<link rel="stylesheet" href="../../../assets/live.css">
</head>
<body>
<div class="stage frayer" id="stage">
  <header>
    <span class="t">Year 1/2 · Mix It</span>
    <span class="u">Word wall: Frayer model</span>
    <button type="button" class="theme" data-theme-toggle>Light mode</button>
    <a href="../lessons/04-mix-it/">Exit</a>
  </header>

  <div class="body">
    <div class="grid" id="grid"></div>
    <div class="word" id="word" aria-live="polite"></div>
  </div>

  <footer>
    <span class="hint">Word:</span>
    <div id="words" style="display: flex; gap: 10px"></div>
    <button type="button" class="btn spacer" id="showAll">Show all</button>
    <button type="button" class="btn" id="hideAll">Hide all</button>
  </footer>
</div>

<script>
// Colours come from tokens.css; T("violet") gives a token's hex value.
const T = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
// Small pictures, drawn in a 64x64 box.
const cup = (inner) => `${inner}<path d="M12 14 H52 L48 56 H16 Z" fill="none" stroke="var(--text-violet)" stroke-width="3" stroke-linejoin="round"/>`;
const P = {
  flour: () => cup(`<path d="M14 30 H50 L48 56 H16 Z" fill="var(--paper)"/><circle cx="24" cy="40" r="1.6" fill="var(--mist)"/><circle cx="34" cy="46" r="1.6" fill="var(--mist)"/><circle cx="42" cy="38" r="1.6" fill="var(--mist)"/><circle cx="28" cy="51" r="1.6" fill="var(--mist)"/>`),
  water: () => cup(`<path d="M14 30 H50 L48 56 H16 Z" fill="var(--ion-cyan)"/>`),
  paste: () => `<path d="M6 30 H58 C58 50 46 58 32 58 C18 58 6 50 6 30 Z" fill="var(--mist)" stroke="var(--text-violet)" stroke-width="3"/><path d="M14 30 C20 24 28 34 34 28 C40 22 46 32 50 30" fill="none" stroke="var(--ink)" stroke-width="3"/><line x1="40" y1="34" x2="56" y2="4" stroke="var(--mist)" stroke-width="5" stroke-linecap="round"/>`,
  paints: () => `<circle cx="22" cy="28" r="15" fill="var(--violet)"/><circle cx="42" cy="28" r="15" fill="var(--solar-orange)"/><path d="M32 17 A15 15 0 0 1 32 39 A15 15 0 0 1 32 17 Z" fill="var(--violet)"/><text x="32" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">mix</text>`,
  batter: () => `<path d="M6 30 H58 C58 50 46 58 32 58 C18 58 6 50 6 30 Z" fill="var(--solar-orange)" stroke="var(--text-violet)" stroke-width="3"/><path d="M30 34 L44 6 M36 34 L46 8" stroke="var(--mist)" stroke-width="3" stroke-linecap="round"/><ellipse cx="34" cy="30" rx="8" ry="5" fill="none" stroke="var(--mist)" stroke-width="3"/>`,
  twoCups: () => `<path d="M4 22 H28 L26 56 H6 Z" fill="var(--paper)" stroke="var(--text-violet)" stroke-width="3"/><path d="M36 22 H60 L58 56 H38 Z" fill="var(--ion-cyan)" stroke="var(--text-violet)" stroke-width="3"/>`,
  blocks: () => `<rect x="20" y="40" width="24" height="16" fill="var(--solar-orange)"/><rect x="20" y="24" width="24" height="16" fill="var(--violet)"/><rect x="20" y="8" width="24" height="16" fill="var(--solar-orange)"/>`,
  mat: () => { let s = ""; for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) s += `<rect x="${8 + c * 12}" y="${8 + r * 12}" width="12" height="12" fill="${(r + c) % 2 ? T("paper") : (r % 2 ? T("violet") : T("solar-orange"))}" stroke="var(--mist)"/>`; return s; },
  stuck: () => `<rect x="4" y="12" width="56" height="12" fill="var(--paper)" stroke="var(--mist)" stroke-width="2"/><rect x="20" y="24" width="24" height="3" fill="var(--mist)"/><rect x="20" y="27" width="24" height="24" fill="var(--paper)" stroke="var(--text-violet)" stroke-width="2"/>`,
  tape: () => `<circle cx="32" cy="32" r="22" fill="var(--panel-2)" stroke="var(--solar-orange)" stroke-width="3"/><circle cx="32" cy="32" r="10" fill="var(--paper)" stroke="var(--solar-orange)" stroke-width="3"/><path d="M50 44 L62 52 L58 58 L46 50 Z" fill="var(--panel-2)" stroke="var(--solar-orange)" stroke-width="2"/>`,
  honey: () => `<rect x="16" y="20" width="32" height="36" rx="6" fill="var(--solar-orange)" stroke="var(--solar-orange)" stroke-width="3"/><rect x="14" y="12" width="36" height="9" rx="3" fill="var(--violet)"/><path d="M26 56 C26 62 30 62 30 56" fill="var(--solar-orange)"/>`,
  strip: () => `<rect x="24" y="6" width="16" height="52" fill="var(--paper)" stroke="var(--text-violet)" stroke-width="2"/>`,
  fan: () => { let s = ""; for (let i = 0; i < 6; i++) { const x = 6 + i * 9; s += `<path d="M${x} ${i % 2 ? 18 : 24} L${x + 9} ${i % 2 ? 24 : 18} L${x + 9} ${i % 2 ? 54 : 48} L${x} ${i % 2 ? 48 : 54} Z" fill="${i % 2 ? T("paper") : T("mist")}" stroke="var(--text-violet)" stroke-width="2" stroke-linejoin="round"/>`; } return s; },
  label: () => `<path d="M8 20 H44 L58 32 L44 44 H8 Z" fill="var(--paper)" stroke="var(--text-violet)" stroke-width="3" stroke-linejoin="round"/><circle cx="46" cy="32" r="3" fill="var(--text-violet)"/><text x="24" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="var(--void)">flour</text>`,
  count: () => `<path d="M4 26 H20 L18 54 H6 Z" fill="var(--paper)" stroke="var(--text-violet)" stroke-width="2.5"/><path d="M24 26 H40 L38 54 H26 Z" fill="var(--paper)" stroke="var(--text-violet)" stroke-width="2.5"/><path d="M44 26 H60 L58 54 H46 Z" fill="var(--paper)" stroke="var(--text-violet)" stroke-width="2.5"/><text x="32" y="18" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">3</text>`,
  cupboard: () => `<rect x="10" y="6" width="44" height="52" rx="3" fill="var(--panel-2)" stroke="var(--text-violet)" stroke-width="3"/><line x1="32" y1="6" x2="32" y2="58" stroke="var(--text-violet)" stroke-width="3"/><circle cx="27" cy="34" r="2.5" fill="var(--solar-orange)"/><circle cx="37" cy="34" r="2.5" fill="var(--solar-orange)"/>`,
};

// Frayer models for the lesson's key words.
const WORDS = [
  {
    word: "property",
    def: "What a material is like: how it looks, feels or acts.",
    traits: ["you can see, feel or test it", "powdery, runny and sticky are properties", "every material has properties"],
    yes: [["flour", "flour is powdery"], ["water", "water is runny"], ["paste", "paste is sticky"]],
    no: [["label", "its name"], ["count", "how many cups"], ["cupboard", "where it is kept"]],
  },
  {
    word: "paste",
    def: "Flour and water mixed together. It is thick and sticky.",
    traits: ["thick and gooey", "sticky when it is wet", "hard when it is dry", "a new material!"],
    yes: [["paste", "our flour paste"], ["stuck", "paste holding paper"]],
    no: [["flour", "dry flour"], ["water", "water"], ["tape", "sticky tape"]],
  },
  {
    word: "new material",
    def: "A material made from other materials, with new properties.",
    traits: ["made from other materials", "it has new properties", "it is not like what it was made from"],
    yes: [["paste", "paste from flour and water"], ["batter", "cake batter"], ["strip", "paper, made from wood"]],
    no: [["fan", "a folded fan: still paper"], ["mat", "a woven mat: still paper"], ["twoCups", "flour and water side by side"]],
  },
];

const BOXES = [
  { key: "def", label: "What does it mean?", cls: "top left" },
  { key: "traits", label: "What is it like?", cls: "top right" },
  { key: "yes", label: "Examples", cls: "left" },
  { key: "no", label: "Non-examples", cls: "right no" },
];

const $ = (id) => document.getElementById(id);
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pic = (name, mark) => `<span class="pic"><svg viewBox="0 0 64 64" aria-hidden="true">${P[name]()}</svg><span class="mark">${mark}</span></span>`;

function content(w, key) {
  if (key === "def") return `<p class="def">${esc(w.def)}</p>`;
  if (key === "traits") return `<ul class="traits">${w.traits.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`;
  const mark = key === "yes" ? "✓" : "✗";
  return `<div class="items">${w[key].map(([p, t]) => `<div class="item">${pic(p, mark)}<span>${esc(t)}</span></div>`).join("")}</div>`;
}

let current = 0;

function show(i) {
  current = i;
  const w = WORDS[i];
  $("word").textContent = w.word;
  $("grid").innerHTML = BOXES.map((b, n) => `
    <section class="box ${b.cls}" aria-label="${b.label}">
      <p class="label">${b.label}</p>
      ${content(w, b.key)}
      <button type="button" class="cover" data-box="${n}"><strong>${b.label}</strong><span>Think first, then tap to show</span></button>
    </section>`).join("");
  [...$("words").children].forEach((btn, j) => btn.setAttribute("aria-pressed", String(j === i)));
}

function reveal(n) {
  const cover = document.querySelector(`.cover[data-box="${n}"]`);
  if (cover) cover.hidden = true;
}

WORDS.forEach((w, j) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "btn";
  b.textContent = w.word;
  b.addEventListener("click", () => show(j));
  $("words").appendChild(b);
});
$("grid").addEventListener("click", (e) => {
  const cover = e.target.closest(".cover");
  if (cover) cover.hidden = true;
});
$("showAll").addEventListener("click", () => BOXES.forEach((_, n) => reveal(n)));
$("hideAll").addEventListener("click", () => show(current));
document.addEventListener("keydown", (e) => {
  if (["1", "2", "3", "4"].includes(e.key)) reveal(Number(e.key) - 1);
  if (e.key === "ArrowRight") show((current + 1) % WORDS.length);
  if (e.key === "ArrowLeft") show((current + WORDS.length - 1) % WORDS.length);
});

function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / $("stage").offsetHeight);
  $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();
show(0);
</script>
</body>
</html>
