<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>How to test and design · Year 1/2 Design a Carrier</title>
<script src="../../../assets/theme.js" data-area="live"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- Colours and the student styles are shared by every artefact. -->
<link rel="stylesheet" href="../../../assets/tokens.css">
<link rel="stylesheet" href="../../../assets/live.css">
</head>
<body>
<div class="stage howto" id="stage">
  <header>
    <span class="t">Year 1/2 · Design a Carrier</span>
    <span class="u">How to test and design</span>
    <button type="button" class="theme" data-theme-toggle>Light mode</button>
    <a href="../lessons/05-design-a-carrier/">Exit</a>
  </header>

  <div class="body">
    <svg viewBox="0 0 480 470" id="scene" role="img" aria-labelledby="title"></svg>
    <div class="text" aria-live="polite">
      <span class="num" id="num">1</span>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="words" id="words"></div>
    </div>
  </div>

  <footer>
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <button type="button" id="again">Play again</button>
    <button type="button" class="primary" id="next">Next</button>
  </footer>
</div>

<script>
// Colours come from tokens.css; T("violet") gives a token's hex value.
const T = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");

const INK = T("text-violet"), AMBER = T("solar-orange"), PASTE = T("mist");
const seg = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const backdrop = `<rect x="10" y="10" width="460" height="450" rx="22" fill="var(--panel)"/>`;
const label = (x, y, text, size = 26, colour = INK) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${colour}">${text}</text>`;
const book = (x, y) => `<rect x="${x}" y="${y}" width="110" height="90" fill="var(--volt-blue)" stroke="${INK}" stroke-width="4"/><line x1="${x + 14}" y1="${y}" x2="${x + 14}" y2="${y + 90}" stroke="${INK}" stroke-width="3"/>`;
const block = (x, y, i) => `<rect x="${x}" y="${y}" width="28" height="28" fill="${i % 2 ? AMBER : INK}" stroke="var(--void)" stroke-width="2"/>`;

// Strip across the gap, sagging by "sag" pixels, with n blocks stacked in the middle.
function bridge(sag, n, layered) {
  const y = 250;
  let s = book(50, y) + book(320, y) + `<line x1="20" y1="340" x2="460" y2="340" stroke="var(--mist)" stroke-width="4"/>`;
  const thick = layered ? 14 : 5;
  s += `<path d="M110 ${y - thick / 2} Q240 ${y - thick / 2 + sag * 2} 370 ${y - thick / 2}" fill="none" stroke="${layered ? AMBER : T("mist")}" stroke-width="${thick}"/>`;
  if (layered) s += `<path d="M110 ${y + 4} Q240 ${y + 4 + sag * 2} 370 ${y + 4}" fill="none" stroke="${INK}" stroke-width="5"/>`;
  for (let i = 0; i < n; i++) s += block(226 + (i % 2) * 28 - 14, y + sag - 30 - Math.floor(i / 2) * 28 - 0, i);
  return s;
}

// One scene per step: each takes progress p (0 to 1) and returns SVG.
const SCENES = [
  // 1. Make the gap: two books slide into place and a strip lies across.
  (p) => {
    const slide = ease(seg(p, 0, 0.4));
    const x1 = 50 - 40 * (1 - slide), x2 = 320 + 40 * (1 - slide);
    let s = backdrop + `<line x1="20" y1="340" x2="460" y2="340" stroke="var(--mist)" stroke-width="4"/>`;
    s += book(x1, 250) + book(x2, 250);
    const strip = ease(seg(p, 0.45, 0.8));
    s += `<rect x="${110}" y="${250 - 5 - (1 - strip) * 120}" width="260" height="6" fill="var(--paper)" stroke="var(--mist)" stroke-width="2"/>`;
    if (p > 0.82) s += `<line x1="110" y1="205" x2="370" y2="205" stroke="${INK}" stroke-width="3"/><path d="M110 195 V215 M370 195 V215" stroke="${INK}" stroke-width="3"/>` + label(240, 190, "one hand apart", 26);
    return s;
  },
  // 2. Add blocks one at a time until the strip sags.
  (p) => {
    const n = Math.floor(seg(p, 0.05, 0.85) * 8);
    const sag = Math.min(50, n * 6.5 * ease(seg(p, 0.05, 0.9)) + (n >= 7 ? 12 : 0));
    return backdrop + bridge(sag, n, false) + label(240, 80, n ? `${n} ${n === 1 ? "block" : "blocks"}` : "Add one at a time", 34);
  },
  // 3. Test the layered strip and compare.
  (p) => {
    const t = ease(seg(p, 0.05, 0.55));
    let s = backdrop;
    const bar = (x, h, colour, name) =>
      `<rect x="${x}" y="${340 - h * t}" width="90" height="${h * t}" fill="${colour}" stroke="${INK}" stroke-width="3"/>` + label(x + 45, 380, name, 24);
    s += `<line x1="60" y1="340" x2="420" y2="340" stroke="var(--mist)" stroke-width="4"/>`;
    s += bar(100, 100, T("panel-2"), "single") + bar(280, 220, AMBER, "layered");
    s += label(240, 70, "Write both numbers", 32);
    if (p > 0.7) s += label(240, 430, "Which held more?", 30, T("text-orange"));
    return s;
  },
  // 4. Draw the carrier: base, sides, handle, in that order.
  (p) => {
    const draw = (a, b, d, w = 6, colour = INK) => {
      const t = seg(p, a, b);
      return t > 0 ? `<path d="${d}" fill="none" stroke="${colour}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - t}"/>` : "";
    };
    let s = backdrop + `<rect x="50" y="50" width="380" height="370" rx="8" fill="var(--panel-2)" stroke="var(--ink)" stroke-width="3" stroke-dasharray="10 8"/>`;
    s += draw(0.05, 0.3, "M130 360 H350");
    s += draw(0.3, 0.6, "M130 360 L110 230 M350 360 L370 230");
    s += draw(0.6, 0.9, "M110 230 C110 100 370 100 370 230");
    if (p > 0.3) s += label(240, 395, "base", 26, AMBER);
    if (p > 0.6) s += label(70, 300, "sides", 24, AMBER);
    if (p > 0.9) s += label(240, 100, "handle", 26, AMBER);
    return s;
  },
  // 5. Label the techniques with arrows.
  (p) => {
    const arrow = (a, x1, y1, x2, y2, text, tx, ty) => {
      const t = seg(p, a, a + 0.2);
      if (t <= 0) return "";
      return `<g opacity="${t}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${AMBER}" stroke-width="4"/><circle cx="${x2}" cy="${y2}" r="6" fill="${AMBER}"/>${label(tx, ty, text, 22, T("text-orange"))}</g>`;
    };
    let s = backdrop + `<rect x="50" y="50" width="380" height="370" rx="8" fill="var(--panel-2)" stroke="var(--ink)" stroke-width="3" stroke-dasharray="10 8"/>`;
    s += `<path d="M130 360 H350 M130 360 L110 230 M350 360 L370 230 M110 230 C110 100 370 100 370 230" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
    s += arrow(0.05, 240, 360, 240, 330, "pasted base", 240, 305);
    s += arrow(0.3, 70, 300, 116, 300, "woven sides", 100, 280);
    s += arrow(0.55, 240, 110, 240, 128, "twisted handle", 240, 90);
    s += label(240, 440, p > 0.8 ? "At least two techniques!" : "", 28);
    return s;
  },
];

const STEPS = [
  { title: "Make a gap.", sub: "Stand two books one hand apart. Lay a strip across.", dur: 5000, words: ["two books", "one hand apart", "strip across"] },
  { title: "Add blocks, one at a time.", sub: "Count aloud. Stop when it sags.", dur: 8000, words: ["gently", "count", "stop at the sag"], wordsFrom: 0.5 },
  { title: "Test the layered strip too.", sub: "Same gap, same blocks. Which held more?", dur: 6000, words: ["write both numbers", "compare"], wordsFrom: 0.6 },
  { title: "Draw your carrier.", sub: "Base first, then the sides, then a handle.", dur: 7000, words: ["base", "sides", "handle"], wordsAt: [0.3, 0.6, 0.9] },
  { title: "Label your techniques.", sub: "Use at least two: fold, twist, weave or paste.", dur: 7000, words: [["fold", "yes"], ["twist", "yes"], ["weave", "yes"], ["paste", "yes"]], wordsFrom: 0.3 },
];

const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = 0, start = 0, frame = 0;

function renderWords(step, p) {
  const n = step.words.length;
  $("words").innerHTML = step.words.map((w, i) => {
    const [text, kind] = Array.isArray(w) ? w : [w, ""];
    const at = step.wordsAt ? step.wordsAt[i] : (step.wordsFrom ?? 0.1) + (i / n) * (1 - (step.wordsFrom ?? 0.1)) * 0.8;
    return `<span class="word ${kind}${p >= at ? " done" : ""}">${text}</span>`;
  }).join("");
}

function tick(now) {
  const step = STEPS[current];
  const p = reduceMotion ? 1 : Math.min(1, (now - start) / step.dur);
  $("scene").innerHTML = SCENES[current](p);
  renderWords(step, p);
  if (p < 1) frame = requestAnimationFrame(tick);
}

function go(i) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const step = STEPS[current];
  $("num").textContent = current + 1;
  $("title").textContent = step.title;
  $("sub").textContent = step.sub;
  [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", j === current ? "step" : "false"));
  $("back").disabled = current === 0;
  $("next").disabled = current === STEPS.length - 1;
  cancelAnimationFrame(frame);
  start = performance.now();
  frame = requestAnimationFrame(tick);
}

STEPS.forEach((_, j) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dot";
  b.textContent = j + 1;
  b.setAttribute("aria-label", `Step ${j + 1}`);
  b.addEventListener("click", () => go(j));
  $("dots").appendChild(b);
});
$("back").addEventListener("click", () => go(current - 1));
$("next").addEventListener("click", () => go(current + 1));
$("again").addEventListener("click", () => go(current));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") go(current - 1);
});

function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / $("stage").offsetHeight);
  $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();
go(0);
</script>
</body>
</html>
