<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>How to follow the signal · Year 1/2 Safe and Kind in Our Room</title>
<script src="../../../assets/theme.js" data-area="live"></script>
<script src="../../../assets/live.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<!-- Colours and the student styles are shared by every artefact. -->
<link rel="stylesheet" href="../../../assets/tokens.css">
<link rel="stylesheet" href="../../../assets/live.css">
</head>
<body>
<div class="stage howto" id="stage">
  <header>
    <span class="t">Year 1/2 · Safe and Kind in Our Room</span>
    <span class="u">How to follow the signal</span>
    <button type="button" class="theme" data-theme-toggle>Light mode</button>
    <a href="../lessons/01-safe-and-kind-in-our-room/">Exit</a>
  </header>

  <div class="body">
    <svg viewBox="0 0 480 470" id="scene" role="img" aria-labelledby="title"></svg>
    <div class="text" aria-live="polite">
      <span class="num" id="num">1</span>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
      <div class="words" id="words"></div>
    </div>
  </div>

  <footer>
    <button type="button" id="back">Back</button>
    <div class="dots" id="dots"></div>
    <button type="button" id="again">Play again</button>
    <button type="button" class="primary" id="next">Next</button>
  </footer>
</div>

<script>
// Colours come from tokens.css; T("violet") gives a token's hex value.
const T = (name) => getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim();
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");

const INK = T("text-violet"), AMBER = T("solar-orange"), VIOLET = T("violet");
const seg = (p, a, b) => Math.min(1, Math.max(0, (p - a) / (b - a)));
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const backdrop = `<rect x="10" y="10" width="460" height="450" rx="22" fill="var(--panel)"/>`;
const label = (x, y, text, size = 26, colour = INK) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${colour}">${text}</text>`;
// A simple student: head, body, two arms. "lean" tilts a walking student.
const student = (x, y, colour = VIOLET, arms = "down", lean = 0) => {
  const a = arms === "up" ? `M${x} ${y + 10} L${x - 36} ${y - 20} M${x} ${y + 10} L${x + 36} ${y - 20}` : `M${x} ${y + 10} L${x - 30} ${y + 50} M${x} ${y + 10} L${x + 30} ${y + 50}`;
  return `<g transform="rotate(${lean} ${x} ${y + 60})"><circle cx="${x}" cy="${y - 30}" r="24" fill="${colour}"/><rect x="${x - 22}" y="${y - 2}" width="44" height="70" rx="14" fill="${colour}"/><path d="${a}" stroke="${colour}" stroke-width="12" stroke-linecap="round" fill="none"/></g>`;
};
const waves = (x, y, n, colour = AMBER) => {
  let s = "";
  for (let i = 0; i < n; i++) s += `<path d="M${x + 20 + i * 26} ${y - 24 - i * 8} Q${x + 44 + i * 26} ${y} ${x + 20 + i * 26} ${y + 24 + i * 8}" fill="none" stroke="${colour}" stroke-width="8" stroke-linecap="round"/>`;
  return s;
};
const bell = (x, y) => `<path d="M${x - 40} ${y + 50} C${x - 40} ${y - 30} ${x - 20} ${y - 60} ${x} ${y - 60} C${x + 20} ${y - 60} ${x + 40} ${y - 30} ${x + 40} ${y + 50} Z" fill="${AMBER}"/><rect x="${x - 54}" y="${y + 50}" width="108" height="14" rx="7" fill="${AMBER}"/><circle cx="${x}" cy="${y + 80}" r="12" fill="${AMBER}"/>`;

// One scene per step: each takes progress p (0 to 1) and returns SVG.
const SCENES = [
  // 1. Hear the signal: the bell rings.
  (p) => {
    const n = Math.floor(seg(p, 0.1, 0.7) * 3) + 1;
    return backdrop + bell(190, 200) + (p > 0.1 ? waves(240, 200, n) : "") + label(240, 410, "The signal!", 32);
  },
  // 2. Freeze: a walking student stops and stands tall.
  (p) => {
    const walk = 1 - ease(seg(p, 0.1, 0.5));
    const x = 160 + (1 - walk) * 80, lean = walk * 12 * Math.sin(p * 30);
    let s = backdrop + `<line x1="40" y1="360" x2="440" y2="360" stroke="var(--mist)" stroke-width="4"/>`;
    s += student(x, 260, VIOLET, "down", lean);
    if (p > 0.55) s += label(240, 100, "FREEZE", 56, AMBER);
    return s;
  },
  // 3. Look: eyes on James (a teacher marker).
  (p) => {
    const t = ease(seg(p, 0.1, 0.5));
    let s = backdrop + student(130, 270, VIOLET) + student(240, 270, VIOLET) + student(350, 270, VIOLET);
    s += `<g opacity="${t}"><circle cx="240" cy="110" r="30" fill="${AMBER}"/><rect x="214" y="144" width="52" height="40" rx="12" fill="${AMBER}"/></g>`;
    if (p > 0.4) s += `<path d="M130 238 L222 130 M240 238 V190 M350 238 L258 130" stroke="${INK}" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round" fill="none"/>`;
    return s + label(240, 410, "Eyes on the teacher", 30);
  },
  // 4. Listen: a student with an ear and quiet waves coming in.
  (p) => {
    const n = Math.floor(seg(p, 0.1, 0.8) * 3) + 1;
    let s = backdrop + student(300, 260, VIOLET);
    s += `<g transform="translate(480 0) scale(-1 1)">${waves(180, 230, n)}</g>`;
    s += `<path d="M268 220 C260 205 264 190 276 190" fill="none" stroke="${AMBER}" stroke-width="5" stroke-linecap="round"/>`;
    return s + label(240, 410, "Listen for the job", 30);
  },
  // 5. Do the job: students walk to the mat and sit.
  (p) => {
    const m = ease(seg(p, 0.1, 0.9));
    let s = backdrop + `<rect x="80" y="330" width="320" height="30" rx="10" fill="${T("violet")}" opacity="0.8"/>`;
    const x1 = 100 + m * 70, x2 = 380 - m * 70;
    s += student(x1, 250 + m * 40, VIOLET) + student(x2, 250 + m * 40, VIOLET);
    return s + (p > 0.8 ? label(240, 120, "Quiet and safe", 38, AMBER) : "");
  },
];

const STEPS = [
  { title: "Hear the signal.", sub: "It is the same sound every time.", dur: 5000, words: ["listen", "same sound"] },
  { title: "Freeze.", sub: "Stop your body. Stop your voice.", dur: 5000, words: ["stop", "stay still"], wordsFrom: 0.5 },
  { title: "Look at James.", sub: "Eyes up, ready to listen.", dur: 5000, words: ["eyes up", "ready"], wordsFrom: 0.4 },
  { title: "Listen for the job.", sub: "Wait until the job is said.", dur: 6000, words: ["listen", "wait"], wordsFrom: 0.3 },
  { title: "Do the job.", sub: "Walk slowly, safely and kindly.", dur: 6000, words: [["walk", "yes"], ["safe", "yes"], ["kind", "yes"]], wordsFrom: 0.4 },
];

const $ = (id) => document.getElementById(id);
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = 0, start = 0, frame = 0;

function renderWords(step, p) {
  const n = step.words.length;
  $("words").innerHTML = step.words.map((w, i) => {
    const [text, kind] = Array.isArray(w) ? w : [w, ""];
    const at = step.wordsAt ? step.wordsAt[i] : (step.wordsFrom ?? 0.1) + (i / n) * (1 - (step.wordsFrom ?? 0.1)) * 0.8;
    return `<span class="word ${kind}${p >= at ? " done" : ""}">${text}</span>`;
  }).join("");
}

function tick(now) {
  const step = STEPS[current];
  const p = reduceMotion ? 1 : Math.min(1, (now - start) / step.dur);
  $("scene").innerHTML = SCENES[current](p);
  renderWords(step, p);
  if (p < 1) frame = requestAnimationFrame(tick);
}

function go(i) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const step = STEPS[current];
  $("num").textContent = current + 1;
  $("title").textContent = step.title;
  $("sub").textContent = step.sub;
  [...$("dots").children].forEach((d, j) => d.setAttribute("aria-current", j === current ? "step" : "false"));
  $("back").disabled = current === 0;
  $("next").disabled = current === STEPS.length - 1;
  cancelAnimationFrame(frame);
  start = performance.now();
  frame = requestAnimationFrame(tick);
}

STEPS.forEach((_, j) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "dot";
  b.textContent = j + 1;
  b.setAttribute("aria-label", `Step ${j + 1}`);
  b.addEventListener("click", () => go(j));
  $("dots").appendChild(b);
});
$("back").addEventListener("click", () => go(current - 1));
$("next").addEventListener("click", () => go(current + 1));
$("again").addEventListener("click", () => go(current));
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft") go(current - 1);
});

// Inside the lesson slides, the arrows go through these steps first (live.js).
window.liveSteps = { kind: "steps", count: STEPS.length, at: () => current, go };

function fit() {
  const scale = Math.min(innerWidth / 1280, innerHeight / $("stage").offsetHeight);
  $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", fit);
fit();
go(0);
</script>
</body>
</html>
