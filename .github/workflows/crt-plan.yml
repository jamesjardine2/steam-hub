name: Make a CRT plan with Claude
run-name: "CRT plan: ${{ inputs.unit }} Lesson ${{ inputs.lesson }}"

# Started from a lesson page ("Make a CRT plan"). Claude Code writes a
# printable CRT version of the lesson as HTML, Chrome prints it to a PDF,
# then the site is rebuilt so the PDF can be downloaded.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: "Unit folder, e.g. 2026-t4-y12-paper-makers"
        required: true
        type: string
      lesson:
        description: "Lesson number"
        required: true
        type: string
      notes:
        description: "Notes from James"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: crt-plan
  cancel-in-progress: false

jobs:
  crt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code

      - name: Check the inputs
        env:
          UNIT: ${{ inputs.unit }}
          LESSON: ${{ inputs.lesson }}
        run: |
          [[ "$UNIT" =~ ^[a-z0-9-]+$ && -d "content/units/$UNIT" ]] || { echo "Unknown unit: $UNIT"; exit 1; }
          [[ "$LESSON" =~ ^[0-9]{1,2}$ ]] || { echo "Lesson must be a number"; exit 1; }
          NN=$(printf %02d "$((10#$LESSON))")
          ls content/units/$UNIT/lessons/$NN-*.md >/dev/null 2>&1 || { echo "Lesson $LESSON has no plan yet"; exit 1; }
          echo "NN=$NN" >> "$GITHUB_ENV"

      - name: Claude writes the CRT plan
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          UNIT: ${{ inputs.unit }}
          LESSON: ${{ inputs.lesson }}
          NOTES: ${{ inputs.notes }}
        run: |
          claude -p "Read .github/crt-plan.md and follow it exactly. Unit folder: $UNIT. Lesson number: $LESSON. Notes from James: ${NOTES:-none}" \
            --permission-mode acceptEdits \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" "Bash(grep *)"

      - name: Print the PDF
        env:
          UNIT: ${{ inputs.unit }}
        run: |
          DIR="content/units/$UNIT/crt"
          [ -f "$DIR/$NN-crt.html" ] || { echo "Claude did not write $DIR/$NN-crt.html"; exit 1; }
          if grep -nP '[\x{2013}\x{2014}]' "$DIR/$NN-crt.html"; then echo "Found an en or em dash, not publishing."; exit 1; fi
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="$PWD/$DIR/$NN-crt.pdf" "file://$PWD/$DIR/$NN-crt.html"
          [ -s "$DIR/$NN-crt.pdf" ] || { echo "The PDF was not made"; exit 1; }

      - name: Check the site builds
        run: npm run build

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT: ${{ inputs.unit }}
          LESSON: ${{ inputs.lesson }}
        run: |
          git config user.name "Claude (CRT planner)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "content/units/$UNIT/crt"
          if git diff --cached --quiet; then echo "Claude made no changes."; exit 1; fi
          git commit -m "CRT plan for Lesson $LESSON of $UNIT" -m "Written by Claude from the hub's CRT button."
          # Ticks may have been saved while Claude worked.
          git pull --rebase
          git push
          # Pushes made with the workflow's own token do not start other
          # workflows, so start the deploy directly.
          gh workflow run deploy.yml --ref main
